ssão para comissionados. Gestante (inclusive comissionada, efetiva, empregada ou temporária): estabilidade provisória da confirmação da gravidez até 5 meses após o parto, com indenização se exonerada.", "t": "Tratar exoneração como sanção."}, {"id": "6-32", "q": "Quais os requisitos do STF para criar cargos em comissão (RE 1.041.210)?", "a": "Atribuições claras na lei, relação de confiança, proporcionalidade com o número de efetivos, e vedação para funções técnicas ou operacionais.", "t": "Criar comissionado para função técnica."}, {"id": "6-33", "q": "O que veda a Súmula Vinculante 13 (nepotismo)?", "a": "Nomear cônjuge, companheiro ou parente até 3º grau (colateral ou por afinidade) da autoridade nomeante ou de servidor com cargo de direção na mesma pessoa jurídica; inclui o nepotismo cruzado, que exige potencial de interferir na seleção (hierarquia). Gera improbidade. Não se aplica automaticamente a ministros e secretários (cargos políticos), salvo fraude, falta de qualificação ou inidoneidade moral.", "t": "Aplicar a vedação de forma absoluta a cargos políticos."}, {"id": "6-34", "q": "Julgue: o nepotismo impede o filho de uma autoridade de tomar posse em cargo efetivo na mesma entidade.", "a": "ERRADO. A vedação alcança só cargos em comissão e funções de confiança; o acesso por concurso é legítimo.", "t": "Estender a SV 13 a cargos efetivos."}], "8": [{"id": "8-1", "q": "A quem se aplica a Lei 8.112/1990?", "a": "Aos servidores da União, na Administração direta, autarquias e fundações públicas de direito público. Não alcança empregados de EP e SEM (CLT). O vínculo é estatutário: de natureza legal, não contratual. Servidor é quem é legalmente investido em cargo público; cargo é o conjunto de atribuições criado por lei, com denominação própria e vencimento pago pelos cofres públicos.", "t": "Aplicar a lei a empregados de empresas estatais."}, {"id": "8-2", "q": "Quais os requisitos básicos de investidura (art. 5º)?", "a": "Nacionalidade brasileira; gozo dos direitos políticos; quitação com obrigações militares e eleitorais; nível de escolaridade exigido; idade mínima de 18 anos; aptidão física e mental. Estrangeiros: norma de eficácia limitada (hoje, universidades e instituições de pesquisa federais). PcD: reserva de até 20% das vagas.", "t": "Fixar idade mínima de 21 anos."}, {"id": "8-3", "q": "Quais as súmulas citadas sobre limite de idade e psicotécnico?", "a": "Súmula 14 do STF: é inconstitucional limitar a idade por mero ato administrativo (exige lei). Súmula Vinculante 44: o exame psicotécnico exige previsão em lei.", "t": "Admitir limite de idade só no edital."}, {"id": "8-4", "q": "Quais as três etapas do ingresso e seus prazos (N-P-E, 30-15)?", "a": "Nomeação → posse (prazo improrrogável de 30 dias da publicação do ato) → exercício (prazo improrrogável de 15 dias da posse). Nomeação é ato unilateral e a única forma de provimento originário (efetivo exige concurso; comissão é de livre nomeação).", "t": "Trocar os prazos de 30 e 15 dias."}, {"id": "8-5", "q": "Qual o efeito de perder o prazo da posse e o do exercício?", "a": "Posse: nomeação tornada sem efeito (não há exoneração, pois o vínculo não existia). Exercício: o servidor empossado é exonerado. Função de confiança: o exercício coincide com a publicação da designação; se não assumir, o ato é tornado sem efeito.", "t": "Exonerar quem não tomou posse."}, {"id": "8-6", "q": "Como é a posse?", "a": "Aceitação formal das atribuições, deveres e responsabilidades. Exige inspeção médica oficial (obrigatória), declaração de bens e declaração de não acumulação ilegal. Pode ser feita por procuração específica.", "t": "Dispensar a inspeção médica."}, {"id": "8-7", "q": "Qual a jornada e como funciona a dedicação integral?", "a": "6 a 8 horas diárias, máximo de 40 horas semanais (ressalvadas leis específicas). Comissionados e funções de confiança têm dedicação integral, com disponibilidade para convocação. Quem acumula dois cargos efetivos e é nomeado para comissão afasta-se de ambos, salvo compatibilidade de horário e local com um deles, declarada pelas autoridades máximas. É vedado o serviço gratuito, salvo previsão em lei.", "t": "Dizer que a jornada máxima é de 44 horas."}, {"id": "8-8", "q": "Quais são as sete formas de provimento da Lei 8.112 e o que a SV 43 diz?", "a": "Nomeação (única originária), promoção, readaptação, reversão, aproveitamento, reintegração e recondução. Ascensão e transferência foram revogadas e declaradas inconstitucionais (SV 43).", "t": "Incluir a transferência como forma de provimento."}, {"id": "8-9", "q": "Como funcionam promoção e readaptação?", "a": "Promoção: provimento derivado vertical por antiguidade e merecimento; não interrompe o tempo de serviço; é ao mesmo tempo provimento e vacância. Readaptação: investidura em cargo com atribuições compatíveis com limitação física ou mental atestada em inspeção médica, exigindo atribuições afins, mesma habilitação e escolaridade e equivalência de vencimentos; sem vaga, o servidor fica excedente; se totalmente incapaz, aposenta-se.", "t": "Rebaixar vencimento na readaptação."}, {"id": "8-10", "q": "Quais as espécies de reversão?", "a": "De ofício (invalidez): quando a junta médica declara que cessaram os motivos da aposentadoria por invalidez. A pedido (interesse da Administração, discricionária): servidor que se aposentou voluntariamente, estável na atividade, aposentado há no máximo 5 anos, com cargo vago. Vedada a quem completou 70 anos. Se o cargo estiver provido, atua como excedente.", "t": "Admitir reversão após 70 anos."}, {"id": "8-11", "q": "Como funciona o aproveitamento?", "a": "Retorno obrigatório do estável em disponibilidade (remuneração proporcional ao tempo de serviço) após a extinção ou desnecessidade do cargo, em cargo de atribuições e vencimentos compatíveis. Se não assumir no prazo, o aproveitamento é tornado sem efeito e a disponibilidade é cassada.", "t": "Aproveitar servidor não estável."}, {"id": "8-12", "q": "Como funciona a reintegração?", "a": "Reinvestidura do estável no cargo de origem quando a demissão é invalidada administrativa ou judicialmente, com ressarcimento de todas as vantagens. Se o cargo estiver provido, o atual ocupante estável é reconduzido sem indenização, aproveitado em outro ou posto em disponibilidade; se o cargo foi extinto, o reintegrado fica em disponibilidade.", "t": "Indenizar o ocupante reconduzido."}, {"id": "8-13", "q": "Como funciona a recondução na Lei 8.112?", "a": "Retorno do estável ao cargo anteriormente ocupado, só por (1) inabilitação ou desistência em estágio probatório de outro cargo ou (2) reintegração do anterior ocupante. Exige estabilidade no cargo de origem; se estiver ocupado, será aproveitado em outro.", "t": "Admitir recondução de quem não era estável."}, {"id": "8-14", "q": "Qual a duração do estágio probatório na prática e quais os fatores de avaliação (RAPID)?", "a": "A lei menciona 24 meses, mas STF e STJ firmaram 36 meses, acompanhando a estabilidade. Fatores: Responsabilidade, Assiduidade, Produtividade, Iniciativa e Disciplina. Estabilidade: 3 anos de efetivo exercício + avaliação especial por comissão.", "t": "Aplicar 24 meses ao estágio."}, {"id": "8-15", "q": "Que cargos o servidor em estágio pode ocupar e quando o estágio se suspende?", "a": "Pode exercer cargo em comissão ou função de chefia ou assessoramento no órgão de lotação; para ser cedido a outro órgão, só cargos de Natureza Especial ou DAS 4, 5 e 6 ou equivalentes. O estágio fica suspenso nas licenças por doença em pessoa da família, afastamento do cônjuge, atividade política, serviço em organismo internacional e curso de formação.", "t": "Ceder o servidor em estágio para qualquer cargo."}, {"id": "8-16", "q": "Quais são as hipóteses de vacância (art. 33)?", "a": "Exoneração, demissão, promoção, readaptação, aposentadoria, posse em outro cargo inacumulável e falecimento. Promoção e readaptação geram provimento e vacância simultaneamente.", "t": "Incluir a remoção entre as hipóteses."}, {"id": "8-17", "q": "Quando a exoneração é de ofício?", "a": "Inabilitação no estágio probatório; não início do exercício no prazo de 15 dias; insuficiência de desempenho na avaliação periódica; limites de gastos de pessoal da LRF; livre exoneração de comissionados. A exoneração não tem caráter punitivo; também pode ser a pedido.", "t": "Tratar exoneração como punição."}, {"id": "8-18", "q": "Quais as modalidades de remoção (art. 36)?", "a": "De ofício (interesse da Administração; mudança permanente de domicílio gera ajuda de custo); a pedido, a critério da Administração (discricionária); a pedido, direito subjetivo (vinculada): acompanhamento de cônjuge ou companheiro deslocado de ofício, motivo de saúde (própria, do cônjuge, companheiro ou dependente, com junta médica oficial) e processo seletivo (concurso de remoção).", "t": "Considerar discricionária a remoção por saúde comprovada."}, {"id": "8-19", "q": "O que é redistribuição (art. 37) e a quem se aplica?", "a": "Deslocamento do cargo (ocupado ou vago) para outro órgão ou entidade do mesmo Poder, sempre de ofício e no interesse da Administração, com equivalência de vencimentos, essência das atribuições e mesmo nível de escolaridade. Independe de estabilidade: servidor em estágio probatório pode ser redistribuído com o cargo.", "t": "Redistribuir cargo para outro Poder."}, {"id": "8-20", "q": "Diferencie remoção e redistribuição.", "a": "Remoção: desloca o servidor dentro do mesmo quadro, com ou sem mudança de sede. Redistribuição: desloca o cargo para outro órgão do mesmo Poder, sempre de ofício. Nenhuma é forma de provimento ou vacância.", "t": "Tratar como provimento ou vacância."}, {"id": "8-21", "q": "Julgue: o servidor nomeado que não toma posse em 30 dias é exonerado.", "a": "ERRADO. A nomeação é tornada sem efeito, pois o vínculo não chegou a se formar. A exoneração ocorre quando o empossado não entra em exercício em 15 dias.", "t": "Aplicar exoneração à perda do prazo da posse."}], "1": [{"id": "1-1", "q": "Qual é o binômio do regime jurídico administrativo e o que ele significa?", "a": "Prerrogativas e sujeições. A Administração fica em posição de verticalidade perante o particular para atingir o benefício da coletividade (no direito privado, as relações são horizontais). Pilar 1: supremacia do interesse público (prerrogativas, como alterar contratos unilateralmente e o poder de polícia). Pilar 2: indisponibilidade do interesse público (sujeições, como licitação e concurso).", "t": "Atribuir à Administração relações de igualdade com o particular."}, {"id": "1-2", "q": "Em que consiste a supremacia do interesse público e qual o limite dela?", "a": "Em conflito entre o interesse do particular e o da coletividade, o público predomina. Fundamenta cláusulas exorbitantes, poder de polícia e desapropriação. Não é absoluta: não se aplica quando a Administração age como Estado-empresário (atividade econômica) nem em contratos de locação e seguro.", "t": "Tratar a supremacia como absoluta."}, {"id": "1-3", "q": "O que é a indisponibilidade do interesse público?", "a": "Representa as sujeições: o administrador é gestor, não dono do interesse público, e não dispõe dele conforme sua vontade. Presente em qualquer atuação da Administração; fundamenta a obrigatoriedade de licitação e de concurso público.", "t": "Confundir com as prerrogativas (que decorrem da supremacia)."}, {"id": "1-4", "q": "Quais são os princípios expressos do art. 37 da CF e existe hierarquia entre eles?", "a": "LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência. Não há hierarquia entre os princípios; havendo conflito, aplica-se a ponderação.", "t": "Dizer que a legalidade sobrepõe os demais princípios."}, {"id": "1-5", "q": "Como a legalidade se aplica à Administração e ao particular?", "a": "Administração: estrita legalidade (só faz o que a lei autoriza ou determina). Administrados: autonomia da vontade (podem fazer tudo o que a lei não proíbe).", "t": "Aplicar à Administração a lógica do particular."}, {"id": "1-6", "q": "O que a impessoalidade veda e garante?", "a": "Veda a promoção pessoal (nomes e símbolos de autoridades em obras). Garante a isonomia e fundamenta a validade dos atos de agentes de fato.", "t": "Esquecer o fundamento da validade dos atos de agentes de fato."}, {"id": "1-7", "q": "Como a moralidade se relaciona com o nepotismo (SV 13)?", "a": "Moralidade exige ética e boa-fé objetiva. A vedação ao nepotismo decorre diretamente da CF (Súmula Vinculante 13), sem necessidade de lei específica; a exceção são os cargos de natureza política. Não se precisa aferir a intenção do agente.", "t": "Exigir lei específica ou prova de intenção para configurar o nepotismo."}, {"id": "1-8", "q": "A publicidade é requisito de validade ou de eficácia do ato?", "a": "De eficácia (exigência de publicação em órgão oficial). Transparência é a regra; sigilo é a exceção (segurança nacional ou intimidade, como dados pessoais).", "t": "Chamar a publicidade de requisito de validade."}, {"id": "1-9", "q": "O que exige o princípio da eficiência?", "a": "Foco em resultados, qualidade e produtividade, prestando serviços públicos de qualidade ao menor custo possível e no menor tempo.", "t": "Reduzir a eficiência a economia de custos."}, {"id": "1-10", "q": "O que é autotutela e qual seu fundamento?", "a": "Poder-dever da Administração de controlar os próprios atos: anular os ilegais e revogar os inconvenientes ou inoportunos (mérito). Fundamento: Súmulas 346 e 473 do STF.", "t": "Dizer que é mera faculdade da Administração."}, {"id": "1-11", "q": "Julgue: a autotutela permite que o Judiciário atue de ofício e revogue atos da Administração.", "a": "ERRADO. A autotutela é da Administração. O Judiciário só age se provocado (inafastabilidade) e nunca revoga ato da Administração, pois não controla mérito: apenas anula por ilegalidade.", "t": "Atribuir ao Judiciário a autotutela ou a revogação."}, {"id": "1-12", "q": "Qual o limite temporal para a Administração anular atos favoráveis?", "a": "5 anos (decadência, no âmbito federal) para atos favoráveis a terceiros de boa-fé, salvo comprovada má-fé. Atos flagrantemente inconstitucionais não se submetem a esse prazo, segundo o STF.", "t": "Aplicar o prazo de 5 anos a atos de má-fé ou flagrantemente inconstitucionais."}, {"id": "1-13", "q": "Quais os elementos do trinômio da proporcionalidade?", "a": "Adequação (meio compatível com o fim), necessidade (meio menos gravoso) e proporcionalidade em sentido estrito (vantagens superam as desvantagens). Razoabilidade: critérios aceitáveis do ponto de vista racional. Proporcionalidade: equilíbrio entre meios e fins.", "t": "Trocar necessidade por adequação."}, {"id": "1-14", "q": "Um ato desarrazoado é apenas inconveniente?", "a": "Não. É ilegal, e por isso o Judiciário pode anulá-lo. Isso não é revisão de mérito: a falta de razoabilidade é considerada forma de ilegalidade.", "t": "Dizer que o Judiciário não pode controlar atos desarrazoados."}, {"id": "1-15", "q": "Diferencie segurança jurídica e proteção à confiança.", "a": "Segurança jurídica: aspecto objetivo (estabilidade das relações consolidadas). Proteção à confiança: aspecto subjetivo (boa-fé do administrado). Atos de agentes de fato são válidos perante terceiros de boa-fé. É proibida a aplicação retroativa de nova interpretação, mesmo sob alegação de interesse público.", "t": "Admitir aplicação retroativa de nova interpretação por interesse público."}, {"id": "1-16", "q": "O que é o princípio da continuidade e quais suas consequências?", "a": "O serviço público não deve parar. Consequências: limitação ao direito de greve (proibido para militares e policiais), impossibilidade de o particular invocar de imediato a “exceção do contrato não cumprido” e os institutos de suplência e delegação.", "t": "Dizer que o particular pode suspender o contrato por inadimplência do Estado."}, {"id": "1-17", "q": "Julgue: a continuidade do serviço público é absoluta.", "a": "ERRADO. O serviço pode ser interrompido em emergência ou, após aviso prévio, por razões de ordem técnica ou segurança, ou por inadimplemento do usuário.", "t": "Ignorar as hipóteses de interrupção."}, {"id": "1-18", "q": "O que são especialidade e tutela?", "a": "Especialidade: as entidades da Administração Indireta atuam estritamente dentro da finalidade prevista na lei que as criou. Tutela (controle finalístico): controle da Direta sobre a Indireta para garantir a especialidade. Não há subordinação, apenas vinculação.", "t": "Falar em hierarquia entre Direta e Indireta."}, {"id": "1-19", "q": "O que é o dever de motivação e qual sua exceção clássica?", "a": "Dever de indicar os fundamentos de fato e de direito das decisões. Exceção clássica: exoneração ad nutum de cargo em comissão.", "t": "Dizer que a motivação nunca é exigível."}, {"id": "1-20", "q": "Como funciona a presunção de legitimidade e veracidade?", "a": "O ato presume-se verdadeiro e conforme a lei até prova em contrário (presunção relativa, juris tantum), com inversão do ônus da prova para o particular.", "t": "Tratar a presunção como absoluta."}, {"id": "1-21", "q": "Qual a diferença entre contraditório e ampla defesa e o que diz a SV 5?", "a": "Contraditório: direito de tomar conhecimento e se contrapor. Ampla defesa: direito de alegar e provar, com todos os meios e recursos válidos. Obrigatórios em processos com acusados ou litigantes. SV 5: a falta de defesa técnica por advogado no PAD não ofende a Constituição.", "t": "Exigir advogado obrigatório no PAD."}, {"id": "1-22", "q": "Diferencie entidades e órgãos públicos.", "a": "Entidades: pessoas jurídicas. Políticas (União, Estados, DF e Municípios) têm autonomia política e capacidade legislativa; administrativas (Administração Indireta) têm só autoadministração. Órgãos: centros de competência sem personalidade, cujos atos são imputados à pessoa jurídica a que pertencem.", "t": "Atribuir personalidade jurídica a órgãos."}, {"id": "1-23", "q": "Julgue: órgãos públicos possuem personalidade jurídica própria.", "a": "ERRADO. São “partes de um todo”. Exceção de capacidade processual: órgãos de estatura constitucional (Presidência, TCU, Ministério Público) podem ir a juízo exclusivamente para defender prerrogativas institucionais, sem ter personalidade.", "t": "Confundir capacidade processual com personalidade."}, {"id": "1-24", "q": "Diferencie desconcentração e descentralização.", "a": "Desconcentração: cria órgãos, dentro da mesma pessoa jurídica, com hierarquia; ocorre em todos os Poderes e esferas. Descentralização: cria outra pessoa (entidade), envolve duas pessoas jurídicas, sem hierarquia, apenas vinculação (tutela).", "t": "Dizer que a desconcentração cria nova pessoa jurídica ou rompe a hierarquia."}, {"id": "1-25", "q": "Quais são as formas de descentralização administrativa?", "a": "Por outorga (serviços/técnica): o Estado cria entidade da Administração Indireta e transfere titularidade e execução; exige lei. Por delegação (colaboração): transfere só a execução a particulares, por contrato ou ato administrativo. Territorial/geográfica: territórios federais (hoje inexistentes).", "t": "Dizer que a delegação transfere a titularidade."}, {"id": "1-26", "q": "Existe hierarquia entre os Ministérios e o INSS ou a Petrobras?", "a": "Não. Há vinculação, tutela administrativa ou controle finalístico (supervisão ministerial). Hierarquia é fenômeno interno da mesma pessoa jurídica, e também não existe entre os Poderes.", "t": "Afirmar subordinação entre Administração Direta e Indireta."}]};

 mc('A supremacia do interesse público NÃO se aplica de forma plena quando:',['A Administração atua como Estado-empresário, explorando atividade econômica','A Administração exerce o poder de polícia','A Administração promove uma desapropriação','O contrato prevê cláusula exorbitante'],'A supremacia não é absoluta: não vale para o Estado-empresário nem para contratos de locação e seguro. Poder de polícia, desapropriação e cláusulas exorbitantes são expressões dela.'),

function chunk(a,max){const n=Math.ceil(a.length/max), out=[]; let i=0; for(let k=0;k<n;k++){const size=Math.ceil((a.length-i)/(n-k)); out.push(a.slice(i,i+size)); i+=size;} return out;}

  chunk(items,7).forEach((p,i)=>NODES.push({id:'u'+u.n+'c'+(i+1),unit:u.n,kind:'cards',label:'Cartas '+(i+1),num:i+1,items:p}));
  const qz=(QUIZ[u.n]||[]).map((x,i)=>Object.assign({id:'q'+u.n+'_'+i},x));
  NODES.push({id:'u'+u.n+'t',unit:u.n,kind:'test',label:'Desafio',items:qz});
});

const LS='mesa-direito-adm-v1';
const defState=()=>({v:1,updated:0,xp:0,streak:0,lastDay:'',day:'',dayXp:0,done:{},stars:{},cards:{},badges:{},perfect:0,bossBest:0});
let S=defState();
try{const raw=localStorage.getItem(LS); if(raw){S=Object.assign(defState(),JSON.parse(raw));}}catch(e){}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const yest=()=>{const d=new Date(); d.setDate(d.getDate()-1); return ymd(d);};

let saveTimer=null, saving=false, pending=false, dbDoc=null;
function persist(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!dbDoc) return;
  if(saving){pending=true; return;}
  saving=true;
  try{await dbDoc.set({json:JSON.stringify(S),updated:S.updated});}catch(e){}
  saving=false;
  if(pending){pending=false; flush();}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use('db');
    const user=await window.claude.use('user');
    if(!db||!user) return;
    const uid=await user.id();
    if(!uid) return;
    const ref=db.doc('data/users/'+uid+'/progress-da');
    const snap=await ref.get();
    if(snap.exists){
      const r=JSON.parse(snap.data().json);
      if(r&&r.updated>S.updated){
        S=Object.assign(defState(),r);
        try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
        if(V.name==='home') render();
      }
    }
    dbDoc=ref;
    if(S.updated>0) flush();
  }catch(e){}
}

/* ============ REGRAS DO JOGO ============ */
const streakNow=()=>(S.lastDay===today()||S.lastDay===yest())?S.streak:0;
const dayXpNow=()=>S.day===today()?S.dayXp:0;
function addXp(n){
  const t=today();
  if(S.day!==t){S.day=t; S.dayXp=0;}
  S.xp+=n; S.dayXp+=n;
  if(S.lastDay!==t){S.streak=(S.lastDay===yest())?S.streak+1:1; S.lastDay=t;}
}
function lvl(){
  let i=0; for(let k=0;k<LEVELS.length;k++) if(S.xp>=LEVELS[k].min) i=k;
  const cur=LEVELS[i], nxt=LEVELS[i+1];
  return {i,cur,nxt,pct:nxt?(S.xp-cur.min)/(nxt.min-cur.min):1};
}
const masteredCount=()=>ALLCARDS.filter(c=>(S.cards[c.id]||{}).box>=MASTER).length;

function checkBadges(){
  const out=[];
  BADGES.forEach(b=>{ if(!S.badges[b.id]&&b.test()){S.badges[b.id]=true; out.push(b.name);} });
  return out;
}
function cardUpdate(id,ok){
  const c=S.cards[id]||{box:0,due:0};
  c.box=ok?Math.min(c.box+1,INT.length-1):0;
  c.due=Date.now()+INT[c.box]*864e5;
  S.cards[id]=c;
}

  if(V.name==='lesson'||V.name==='boss'){bar.style.display='none'; return;}
  bar.style.display='';
  bar.innerHTML='<div class="brand"><span class="mark"></span>Mesa de Estudo</div>'+
   '<div class="chips"><span class="chip c-flame" title="Sequência de dias">'+ICON.flame+streakNow()+'</span><span class="chip c-xp" title="XP total">'+ICON.bolt+S.xp+'</span></div>';
}

function nodeCell(n,isNext){
  const done=!!S.done[n.id];
  const cls='node'+(n.kind==='test'?' test':'')+(n.kind==='boss'?' boss':'')+(done?' done':'')+(isNext?' next':'');
  const icon=done?ICON.check:n.kind==='boss'?ICON.crown:n.kind==='test'?ICON.shield:String(n.num);
  return '<div class="cell"><button class="'+cls+'" data-act="node" data-id="'+n.id+'" aria-label="'+esc((n.unit?'Tópico '+n.unit+': ':'')+n.label)+(done?' (concluída)':'')+'">'+icon+'</button>'+
    '<span class="l">'+esc(n.label)+'</span>'+(n.kind!=='boss'&&done?starsRow(S.stars[n.id]||1):'')+'</div>';
}

function viewHome(){
  const lv=lvl(), dx=dayXpNow(), C=2*Math.PI*42, off=C*(1-Math.min(1,dx/GOAL));
  const due=dueIds().length;
  const next=NODES.find(n=>!S.done[n.id]);
  const nextId=next?next.id:null;
  const total=ALLCARDS.length, mastered=masteredCount();
  let units='';
  UNITS.forEach(u=>{
    const nodes=NODES.filter(n=>n.unit===u.n);
    const cards=nodes.filter(n=>n.kind==='cards').flatMap(n=>n.items);
    const m=cards.filter(c=>(S.cards[c.id]||{}).box>=MASTER).length;
    const doneN=nodes.filter(n=>S.done[n.id]).length;
    units+='<section class="unit"><div class="uhead"><span class="unum">'+u.n+'</span><div><h3>'+esc(u.title)+'</h3><p>'+esc(u.sub)+'</p></div></div>'+
      '<div class="umeta"><span>'+doneN+'/'+nodes.length+' etapas</span><div class="xpbar" title="Cartas dominadas"><i style="width:'+(cards.length?Math.round(m/cards.length*100):0)+'%"></i></div><span>'+m+'/'+cards.length+' dominadas</span></div>'+
      '<div class="grid">'+nodes.map(n=>nodeCell(n,n.id===nextId)).join('')+'</div></section>';
  });
  const boss=NODES.find(n=>n.kind==='boss');
  const badges=BADGES.map(b=>'<div class="card badge '+(S.badges[b.id]?'on':'')+'"><div class="coin">'+(S.badges[b.id]?ICON.check:ICON.lock)+'</div><div><b>'+esc(b.name)+'</b><span>'+esc(b.desc)+'</span></div></div>').join('');
  return '<section class="card hero"><div><p class="eyebrow">Nível '+(lv.i+1)+' · Direito Administrativo</p><h1>'+esc(lv.cur.name)+'</h1>'+
    '<div class="xpbar"><i style="width:'+Math.round(lv.pct*100)+'%"></i></div>'+
    '<p class="mono muted">'+S.xp+(lv.nxt?' / '+lv.nxt.min:'')+' XP · '+mastered+'/'+total+' cartas dominadas</p></div>'+
    '<div class="ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="42" fill="none" stroke-width="10"/><circle class="fg" cx="50" cy="50" r="42" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><div><b>'+Math.min(dx,GOAL)+'/'+GOAL+'</b><small>XP hoje</small></div></div></section>'+
    '<section class="card review"><div><h3>Revisão do dia</h3><p>'+(due?due+(due===1?' item pronto':' itens prontos')+' para revisar.':'O que você errar ou estudar volta aqui no tempo certo.')+'</p></div>'+
    '<div class="rbtns"><button class="btn small" data-act="review" '+(due?'':'disabled')+'>Revisar</button><button class="btn small ghost" data-act="free">Sorteio de 10</button></div></section>'+
    units+
    '<div class="sec"><h2>Chefão</h2><span class="mono muted">'+(S.done.boss?'concluído':'estudo de caso')+'</span></div>'+
    '<div class="grid" style="grid-template-columns:1fr">'+nodeCell(boss,nextId==='boss')+'</div>'+
    '<div class="sec"><h2>Conquistas</h2><span class="mono muted">'+BADGES.filter(b=>S.badges[b.id]).length+' de '+BADGES.length+'</span></div>'+
    '<div class="badges">'+badges+'</div>'+
    '<div class="foot"><p>As cartas e os desafios vêm dos seus 8 resumos de Direito Administrativo ('+total+' cartas). As cartas marcadas para verificar na fonte ficaram de fora. Todas as etapas estão liberadas: estude na ordem que preferir.</p>'+
    (V.confirmReset?'<button class="btn small ghost" data-act="reset2">Confirmar: apagar todo o progresso</button>':'<button class="btn small ghost" data-act="reset">Zerar progresso</button>')+'</div>';
}

/* ----- lição ----- */
function startLesson(items,mode,node){
  L={mode,node,queue:items.map(q=>({q,retry:false})),total:items.length,cleared:0,hearts:3,wrong:0,firstOk:0,xp:0,cur:null,noHearts:items.every(q=>q.t==='card')};
  loadItem(); V={name:'lesson'}; render(true);
}
function startNode(n){
  if(n.kind==='boss'){BS={text:'',reveal:false,ticks:[]}; V={name:'boss'}; render(true); return;}
  startLesson(n.kind==='test'?shuffle(n.items):n.items.slice(),'lesson',n);
}
function loadItem(){
  const q=L.queue[0].q;
  if(q.t==='match'){
    const idx=q.pairs.map((_,i)=>i);
    L.cur={cl:shuffle(idx),cr:shuffle(idx),doneL:[],doneR:[],selL:null,miss:false,flash:null,checked:false,ok:null};
  } else if(q.t==='card'){
    L.cur={shown:false,checked:false,ok:null};
  } else {
    const idx=q.o.map((_,i)=>i);
    L.cur={order:q.t==='tf'?idx:shuffle(idx),sel:null,checked:false,ok:null};
  }
}
function record(ok){
  const c=L.cur, it=L.queue[0], card=it.q.t==='card';
  c.checked=true; c.ok=ok;
  if(ok){ L.xp+=card?(it.retry?3:6):(it.retry?5:10); if(!it.retry) L.firstOk++; }
  else { if(!card) L.hearts--; L.wrong++; }
  if(!it.retry) cardUpdate(it.q.id,ok);
}
function finishAnswer(ok){record(ok); render();}
function rateCard(ok){record(ok); nextItem();}
function nextItem(){
  const it=L.queue.shift(), c=L.cur;
  if(!c.ok&&!it.retry) L.queue.push({q:it.q,retry:true}); else L.cleared++;
  if(L.hearts<=0&&!c.ok&&it.q.t!=='card'){V={name:'fail'}; persist(); render(true); return;}
  if(!L.queue.length){completeLesson(); return;}
  loadItem(); render();
}
function completeLesson(){
  const bonus=L.wrong===0?15:0, gain=L.xp+bonus;
  let stars=0;
  if(L.node){
    S.done[L.node.id]=true;
    stars=L.wrong===0?3:L.wrong<=2?2:1;
    S.stars[L.node.id]=Math.max(S.stars[L.node.id]||0,stars);
    if(L.wrong===0) S.perfect=(S.perfect||0)+1;
  }
  addXp(gain);
  const nb=checkBadges();
  persist();
  V={name:'done',gain,bonus,acc:Math.round(L.firstOk/L.total*100),hearts:L.hearts,noHearts:L.noHearts,stars,kind:L.node?L.node.kind:L.mode,nb};
  render(true);
}
function viewLesson(){
  const it=L.queue[0], Q=it.q, c=L.cur;
  const kinds={mc:'Escolha a resposta correta',tf:'Certo ou errado?',match:'Ligue os pares',card:'Cartão de estudo'};
  let body='';
  if(Q.t==='card'){
    body='<div class="flash"><h2 class="qtext">'+esc(Q.q)+'</h2></div>'+
      (c.shown?'<div class="ans">'+esc(Q.a)+'</div>'+(Q.trap?'<div class="trap"><b>Armadilha da banca</b><p>'+esc(Q.trap)+'</p></div>':''):'<p class="hint">Tente responder de cabeça antes de ver a resposta.</p>');
  } else if(Q.t==='match'){
    const left=c.cl.map(k=>{const dn=c.doneL.includes(k); const fl=c.flash&&c.flash.l===k; return '<button class="tile '+(dn?'ok':c.selL===k?'sel':fl?'bad':'')+'" data-act="mL" data-i="'+k+'" '+(dn||c.checked?'disabled':'')+'>'+esc(Q.pairs[k][0])+'</button>';}).join('');
    const right=c.cr.map(k=>{const dn=c.doneR.includes(k); const fl=c.flash&&c.flash.r===k; return '<button class="tile '+(dn?'ok':fl?'bad':'')+'" data-act="mR" data-i="'+k+'" '+(dn||c.checked?'disabled':'')+'>'+esc(Q.pairs[k][1])+'</button>';}).join('');
    body='<h2 class="qtext">'+esc(Q.q)+'</h2><div class="pairs"><div class="col">'+left+'</div><div class="col">'+right+'</div></div>'+(c.checked?'':'<p class="hint">Toque em um termo e depois na definição correspondente.</p>');
  } else {
    body='<h2 class="qtext">'+esc(Q.q)+'</h2><div class="opts">'+c.order.map((oi,pos)=>{
      let cls='';
      if(c.checked) cls=oi===Q.a?'right':pos===c.sel?'wrong':'dim'; else if(pos===c.sel) cls='sel';
      return '<button class="opt '+cls+'" data-act="sel" data-i="'+pos+'" '+(c.checked?'disabled':'')+'><kbd>'+(pos+1)+'</kbd><span>'+esc(Q.o[oi])+'</span></button>';
    }).join('')+'</div>';
  }
  let dock;
  if(Q.t==='card'){
    dock='<div class="dock"><div class="dock-in">'+(c.shown?'<div class="dock-row"><button class="btn no" data-act="rate" data-v="0">Errei</button><button class="btn yes" data-act="rate" data-v="1">Acertei</button></div>':'<button class="btn" data-act="show">Mostrar resposta</button>')+'</div></div>';
  } else if(c.checked){
    const right=Q.t==='match'?'':'<p>Resposta: <b>'+esc(Q.o[Q.a])+'</b></p>';
    dock='<div class="dock '+(c.ok?'ok':'bad')+'"><div class="dock-in"><div class="fb" aria-live="polite"><strong>'+(c.ok?(it.retry?'Agora sim!':'Correto!'):'Não foi dessa vez')+'</strong>'+(c.ok?'':right)+'<p>'+esc(Q.e)+'</p></div><button class="btn" data-act="next">Continuar</button></div></div>';
  } else {
    dock='<div class="dock"><div class="dock-in"><button class="btn" data-act="check" '+((Q.t==='match'||c.sel==null)?'disabled':'')+'>Verificar</button></div></div>';
  }
  const pct=Math.round(L.cleared/L.total*100);
  return '<div class="lesson"><div class="ltop"><button class="x" data-act="exit" aria-label="Sair da lição">'+ICON.close+'</button><div class="progress" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+(L.noHearts?'':'<span class="chip c-heart">'+ICON.heart+Math.max(L.hearts,0)+'</span>')+'</div>'+
    '<p class="kind">'+kinds[Q.t]+(it.retry?' · segunda chance':'')+'</p>'+body+'</div>'+dock;
}

function viewDone(){
  const d=V, titles={cards:'Cartas concluídas',test:'Desafio concluído',review:'Revisão concluída',free:'Treino concluído'};
  const t=titles[d.kind]||'Etapa concluída';
  return '<div class="center">'+(d.stars?starsRow(d.stars,true):'')+'<h1>'+t+'</h1>'+
   '<div class="stats"><div class="stat"><b class="c-xp">+'+d.gain+'</b><span>XP</span></div><div class="stat"><b>'+d.acc+'%</b><span>Precisão</span></div><div class="stat"><b class="'+(d.noHearts?'':'c-heart')+'">'+(d.noHearts?'—':d.hearts)+'</b><span>Vidas</span></div></div>'+
   (d.bonus?'<p class="muted">Inclui +'+d.bonus+' XP por não errar nenhuma.</p>':'')+
   (d.nb&&d.nb.length?'<p><b>Conquista:</b> '+esc(d.nb.join(', '))+'</p>':'')+
   '<button class="btn" data-act="home">Continuar</button></div>';
}
function viewFail(){
  return '<div class="center"><h1>Acabaram as vidas</h1><p class="muted">Sem problema. O que você errou já entrou na revisão do dia. Releia as cartas do tópico e tente de novo.</p>'+
   (L&&L.node?'<button class="btn" data-act="retry">Tentar de novo</button>':'')+'<button class="btn ghost" data-act="home">Voltar à trilha</button></div>';
}

/* ----- Chefão ----- */
function viewBoss(){
  const words=BS.text.trim()?BS.text.trim().split(/\s+/).length:0;
  let h='<div class="ltop"><button class="x" data-act="exit" aria-label="Sair">'+ICON.close+'</button><div class="progress"><i style="width:'+(BS.reveal?100:40)+'%"></i></div></div><div class="lesson">'+
   '<p class="kind">Chefão · estudo de caso</p><h2 class="qtext">'+esc(BOSS.title)+'</h2><p class="scene">'+esc(BOSS.prompt)+'</p>'+
   '<h3 style="margin:22px 0 8px">Seu rascunho</h3><textarea id="draft" placeholder="Escreva como na prova: introdução curta, desenvolvimento por tópicos e conclusão.">'+esc(BS.text)+'</textarea><p class="wc" id="wc">'+words+' palavras · alvo: 180 a 300</p>';
  if(!BS.reveal){
    h+='<button class="btn" data-act="reveal">Comparar com os pontos esperados</button>';
  } else {
    h+='<h3>Marque o que o seu texto cobriu</h3><div class="chk">'+BOSS.pts.map((p,i)=>'<label><input type="checkbox" data-act="tick" data-i="'+i+'" '+(BS.ticks.includes(i)?'checked':'')+'><span>'+esc(p)+'</span></label>').join('')+'</div>'+
     '<button class="btn" data-act="bossdone">Concluir ('+BS.ticks.length+' de '+BOSS.pts.length+')</button>';
  }
  return h+'</div>';
}
function bossDone(){
  const n=BS.ticks.length, gain=n*15, pass=n>=4;
  if(pass) S.done.boss=true;
  S.bossBest=Math.max(S.bossBest,n);
  addXp(gain); const nb=checkBadges(); persist();
  V={name:'bossdone',n,gain,pass,nb}; render(true);
}
function viewBossDone(){
  const d=V;
  return '<div class="center"><p class="eyebrow">Chefão</p><h1>'+(d.pass?'Estudo de caso aprovado':'Quase lá')+'</h1>'+
   '<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>'+d.n+'/'+BOSS.pts.length+'</b><span>Pontos cobertos</span></div><div class="stat"><b class="c-xp">+'+d.gain+'</b><span>XP</span></div></div>'+
   '<p class="muted">'+(d.pass?'Você cobriu o essencial. Na próxima, tente chegar aos 6 pontos.':'São necessários 4 pontos para concluir. Releia os pontos que faltaram e escreva de novo.')+'</p>'+
   (d.nb&&d.nb.length?'<p><b>Conquista:</b> '+esc(d.nb.join(', '))+'</p>':'')+
   '<button class="btn" data-act="home">Continuar</button></div>';
}

/* ============ RENDER E EVENTOS ============ */
function render(top){
  renderBar();
  const map={home:viewHome,lesson:viewLesson,done:viewDone,fail:viewFail,boss:viewBoss,bossdone:viewBossDone};
  $('view').innerHTML=map[V.name]();
  if(top) window.scrollTo(0,0);
  if(V.name==='home'&&firstHome){
    firstHome=false;
    if(Object.keys(S.done).length){const n=document.querySelector('.node.next'); if(n&&n.scrollIntoView) n.scrollIntoView({block:'center'});}
  }
}
function goHome(){V={name:'home'}; L=null; BS=null; render(true);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, i=b.dataset.i!==undefined?+b.dataset.i:null;
  if(a==='tick') return;
  switch(a){
   case 'node': startNode(NODES.find(x=>x.id===b.dataset.id)); break;
   case 'review':{
     const ids=dueIds().sort((x,y)=>S.cards[x].due-S.cards[y].due).slice(0,10);
     if(!ids.length){toast('Nada para revisar agora.'); break;}
     startLesson(ids.map(id=>QMAP[id]),'review',null); break;}
   case 'free':{
     const pool=ALLCARDS.filter(q=>((S.cards[q.id]||{}).box||0)<MASTER);
     startLesson(shuffle(pool.length>=10?pool:ALLCARDS).slice(0,10),'free',null); break;}
   case 'sel': if(L&&!L.cur.checked){L.cur.sel=i; render();} break;
   case 'check': if(L&&L.cur.sel!=null&&!L.cur.checked){finishAnswer(L.cur.order[L.cur.sel]===L.queue[0].q.a);} break;
   case 'show': if(L){L.cur.shown=true; render(); const a=document.querySelector('.ans'); if(a&&a.scrollIntoView) a.scrollIntoView({block:'start',behavior:'smooth'}); window.scrollBy(0,-90);} break;
   case 'rate': if(L&&L.cur.shown&&!L.cur.checked) rateCard(b.dataset.v==='1'); break;
   case 'next': nextItem(); break;
   case 'mL':{const c=L.cur; if(c.checked) break; c.flash=null; c.selL=(c.selL===i)?null:i; render(); break;}
   case 'mR':{
     const c=L.cur, Q=L.queue[0].q; if(c.checked||c.selL==null) break;
     const li=c.selL;
     if(li===i){c.doneL.push(li); c.doneR.push(i); c.selL=null; c.flash=null; if(c.doneL.length===Q.pairs.length){finishAnswer(!c.miss); break;}}
     else {c.miss=true; c.flash={l:li,r:i}; c.selL=null;}
     render(); break;}
   case 'exit': case 'home': goHome(); break;
   case 'retry': if(L&&L.node) startNode(L.node); break;
   case 'reveal': BS.reveal=true; render(); break;
   case 'bossdone': bossDone(); break;
   case 'reset': V.confirmReset=true; render(); break;
   case 'reset2': S=defState(); persist(); V={name:'home'}; render(true); toast('Progresso zerado.'); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.dataset&&t.dataset.act==='tick'){
    const i=+t.dataset.i, k=BS.ticks.indexOf(i);
    if(t.checked&&k<0) BS.ticks.push(i);
    if(!t.checked&&k>=0) BS.ticks.splice(k,1);
    const btn=document.querySelector('[data-act="bossdone"]'); if(btn) btn.textContent='Concluir ('+BS.ticks.length+' de '+BOSS.pts.length+')';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='draft'&&BS){BS.text=e.target.value; const w=BS.text.trim()?BS.text.trim().split(/\s+/).length:0; $('wc').textContent=w+' palavras · alvo: 180 a 300';}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||V.name!=='lesson'||!L) return;
  const c=L.cur, Q=L.queue[0].q;
  if(Q.t==='card'){
    if(!c.shown&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); c.shown=true; render();}
    else if(c.shown&&!c.checked&&(e.key==='1'||e.key==='2')) rateCard(e.key==='2');
  } else {
    if(/^[1-4]$/.test(e.key)&&!c.checked&&Q.t!=='match'&&+e.key<=Q.o.length){c.sel=+e.key-1; render();}
    else if(e.key==='Enter'){ if(c.checked) nextItem(); else if(c.sel!=null&&Q.t!=='match') finishAnswer(c.order[c.sel]===Q.a); }
  }
});

render(true);
initDb();
})();
</script>

</body>
