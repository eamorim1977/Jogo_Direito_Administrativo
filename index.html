<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<style>html{color-scheme:light dark}body{margin:0}</style>
</head>
<body>
<title>Mesa de Estudo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Conceito: trilha de moedas por tópico sobre papel frio, cartas de estudo com autoavaliação,
   desafios com vidas e feedback em painel inferior, como no Duolingo. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E1E7ED; --ink:#13233A; --ink-2:#4B5B71; --line:#C9D2DC;
  --accent:#0B7A75; --accent-deep:#06534F; --accent-ink:#FFFFFF; --accent-tint:#D8EEEC;
  --test:#3B4E7A; --test-deep:#243457; --on-test:#FFFFFF;
  --gold:#E2A400; --gold-deep:#A87900; --gold-ink:#2E2200; --gold-tint:#FBEFC9;
  --ok:#1B8548; --ok-deep:#12602F; --ok-bg:#DCF3E4; --on-ok:#FFFFFF;
  --bad:#CF3F35; --bad-deep:#9C2B24; --bad-bg:#FBE0DD; --on-bad:#FFFFFF;
  --flame:#E8641C; --locked:#C3CCD6; --locked-deep:#A5B0BC;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1626; --surface:#16233A; --surface-2:#1E2E49; --ink:#E7EEF7; --ink-2:#9FB1C8; --line:#2A3B58;
    --accent:#34C4BA; --accent-deep:#1B8A83; --accent-ink:#04201E; --accent-tint:#123B3B;
    --test:#8AA2D6; --test-deep:#52689C; --on-test:#0B1426;
    --gold:#F3BE2F; --gold-deep:#A57D0C; --gold-ink:#2E2200; --gold-tint:#3B3012;
    --ok:#4FD08A; --ok-deep:#2A8F57; --ok-bg:#12331F; --on-ok:#06210F;
    --bad:#FF7B70; --bad-deep:#B94A42; --bad-bg:#3B1B1A; --on-bad:#2B0A08;
    --flame:#FF8A4C; --locked:#2A3B58; --locked-deep:#1E2E49;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1626; --surface:#16233A; --surface-2:#1E2E49; --ink:#E7EEF7; --ink-2:#9FB1C8; --line:#2A3B58;
  --accent:#34C4BA; --accent-deep:#1B8A83; --accent-ink:#04201E; --accent-tint:#123B3B;
  --test:#8AA2D6; --test-deep:#52689C; --on-test:#0B1426;
  --gold:#F3BE2F; --gold-deep:#A57D0C; --gold-ink:#2E2200; --gold-tint:#3B3012;
  --ok:#4FD08A; --ok-deep:#2A8F57; --ok-bg:#12331F; --on-ok:#06210F;
  --bad:#FF7B70; --bad-deep:#B94A42; --bad-bg:#3B1B1A; --on-bad:#2B0A08;
  --flame:#FF8A4C; --locked:#2A3B58; --locked-deep:#1E2E49;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
button,.opt,.tile,.node,label{touch-action:manipulation; -webkit-user-select:none; user-select:none}
html{-webkit-text-size-adjust:100%; overscroll-behavior-y:none}
@media (max-width:480px){
  .hero h1{font-size:24px} .qtext{font-size:22px} .btn{min-height:56px}
  .opt{padding:16px} .tile{padding:14px 12px; min-height:56px}
  .ring{width:84px; height:84px}
}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100%;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10}
.wrap{max-width:640px; margin:0 auto; padding-bottom:48px}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:8px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; line-height:1.15}
p{margin:0}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
svg.i{width:1em; height:1em; fill:currentColor; flex:none}
svg.i.s{fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}

.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0}
.brand{display:flex; align-items:center; gap:10px; font:800 20px var(--f-display); letter-spacing:-.01em}
.mark{width:26px; height:26px; border-radius:50%; background:conic-gradient(var(--gold) 0 25%, var(--gold-deep) 0 50%, var(--gold) 0 75%, var(--gold-deep) 0); box-shadow:inset 0 0 0 5px var(--gold)}
.chips{display:flex; gap:14px}
.chip{display:inline-flex; align-items:center; gap:6px; font:700 16px var(--f-mono)}
.chip svg{font-size:20px}
.c-flame{color:var(--flame)} .c-xp{color:var(--gold)} .c-heart{color:var(--bad)}

.card{background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:18px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border:0; border-radius:16px; background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-deep); font:800 15px var(--f-body); letter-spacing:.05em; text-transform:uppercase; cursor:pointer; width:100%}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--locked); color:var(--ink-2); box-shadow:0 4px 0 var(--locked-deep); cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--accent); box-shadow:none; border:2px solid var(--line)}
.btn.small{min-height:40px; width:auto; font-size:13px; padding:0 16px}
.btn.no{background:var(--bad); color:var(--on-bad); box-shadow:0 4px 0 var(--bad-deep)}
.btn.yes{background:var(--ok); color:var(--on-ok); box-shadow:0 4px 0 var(--ok-deep)}
.dock.ok .btn{background:var(--ok); color:var(--on-ok); box-shadow:0 4px 0 var(--ok-deep)}
.dock.bad .btn{background:var(--bad); color:var(--on-bad); box-shadow:0 4px 0 var(--bad-deep)}

.hero{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center}
.eyebrow{font:700 12px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2)}
.hero h1{font-size:28px; margin:4px 0 12px}
.xpbar{height:12px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.xpbar i{display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .5s}
.hero .mono{font-size:13px; margin-top:6px}
.ring{position:relative; width:96px; height:96px; display:grid; place-items:center; text-align:center}
.ring svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent); transition:stroke-dashoffset .6s}
.ring b{font:700 16px var(--f-mono); display:block; line-height:1.1}
.ring small{font-size:11px; color:var(--ink-2); display:block; line-height:1.2}
.review{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; flex-wrap:wrap}
.review > div:first-child{flex:1; min-width:180px}
.review h3{font-size:17px}
.review p{font-size:14px; color:var(--ink-2)}
.rbtns{display:flex; gap:8px; flex-wrap:wrap}
.sec{display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 8px}
.sec h2{font-size:20px}

/* unidades */
.unit{margin-top:26px}
.uhead{display:flex; gap:14px; align-items:center}
.unum{width:44px; height:44px; border-radius:14px; background:var(--surface-2); display:grid; place-items:center; font:800 22px var(--f-display); flex:none}
.uhead h3{font-size:20px}
.uhead p{font-size:13px; color:var(--ink-2)}
.umeta{display:flex; align-items:center; gap:10px; margin:12px 0 4px; font:700 12px var(--f-mono); color:var(--ink-2); letter-spacing:.04em}
.umeta .xpbar{flex:1; height:8px}
.umeta .xpbar i{background:var(--accent)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:18px 10px; padding:14px 0 6px}
.cell{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
.cell span.l{font-size:12px; font-weight:600; color:var(--ink-2); text-align:center; line-height:1.2}
.node{position:relative; width:68px; height:68px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); box-shadow:inset 0 0 0 5px rgba(255,255,255,.2), 0 5px 0 var(--accent-deep); display:grid; place-items:center; cursor:pointer; font:800 26px var(--f-display)}
.node svg{font-size:28px}
.node:active{transform:translateY(3px); box-shadow:inset 0 0 0 5px rgba(255,255,255,.2), 0 2px 0 var(--accent-deep)}
.node.test{background:var(--test); color:var(--on-test); box-shadow:inset 0 0 0 5px rgba(255,255,255,.2), 0 5px 0 var(--test-deep)}
.node.boss{width:84px; height:84px; background:var(--test); color:var(--on-test); box-shadow:inset 0 0 0 6px rgba(255,255,255,.2), 0 6px 0 var(--test-deep)}
.node.boss svg{font-size:36px}
.node.done{background:var(--gold); color:var(--gold-ink); box-shadow:inset 0 0 0 5px rgba(255,255,255,.28), 0 5px 0 var(--gold-deep)}
.node.next{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{outline:0 solid var(--accent); outline-offset:0}70%{outline:10px solid transparent; outline-offset:0}100%{outline:0 solid transparent}}
.node.next{outline:3px solid var(--accent); outline-offset:4px}
.stars{display:flex; gap:2px; color:var(--gold); font-size:13px; justify-content:center; min-height:13px}
.stars .off{color:var(--locked)}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.badge{display:flex; gap:12px; align-items:center; padding:12px; min-width:0}
.badge .coin{width:38px; height:38px; border-radius:50%; background:var(--locked); display:grid; place-items:center; color:var(--ink-2); flex:none; box-shadow:inset 0 0 0 4px rgba(255,255,255,.15)}
.badge.on .coin{background:var(--gold); color:var(--gold-ink)}
.badge b{display:block; font:700 14px/1.2 var(--f-body)}
.badge span{font-size:12px; color:var(--ink-2); line-height:1.25; display:block}
.badge:not(.on){opacity:.7}
.foot{margin-top:30px; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:10px}
.foot .btn{align-self:flex-start}

/* lição */
.ltop{display:flex; align-items:center; gap:14px; padding:16px 0 8px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5}
.x{border:0; background:transparent; color:var(--ink-2); font-size:26px; padding:4px; cursor:pointer; display:grid}
.progress{flex:1; height:14px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.progress i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s}
.lesson{padding-bottom:220px}
.kind{font:700 12px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:22px 0 8px}
.qtext{font-size:24px; margin-bottom:22px}
.flash .qtext{margin-bottom:18px}
.opts{display:flex; flex-direction:column; gap:12px}
.opt{display:flex; gap:14px; align-items:center; width:100%; text-align:left; padding:14px 16px; border:2px solid var(--line); border-bottom-width:4px; border-radius:16px; background:var(--surface); color:var(--ink); font:600 16px/1.35 var(--f-body); cursor:pointer; min-width:0}
.opt kbd{font:700 13px var(--f-mono); width:28px; height:28px; border:2px solid var(--line); border-radius:8px; display:grid; place-items:center; color:var(--ink-2); flex:none}
.opt span{min-width:0; overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent); background:var(--accent-tint)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg); animation:shake .3s}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pairs .col{display:flex; flex-direction:column; gap:10px; min-width:0}
.tile{padding:12px; border:2px solid var(--line); border-bottom-width:4px; border-radius:14px; background:var(--surface); color:var(--ink); font:600 14px/1.3 var(--f-body); text-align:left; cursor:pointer; min-width:0; overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent); background:var(--accent-tint)}
.tile.ok{border-color:var(--ok); background:var(--ok-bg); opacity:.6; cursor:default}
.tile.bad{border-color:var(--bad); background:var(--bad-bg); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{font-size:14px; color:var(--ink-2); margin-top:14px}
.ans{margin-top:4px; padding:16px; border:2px solid var(--line); border-radius:16px; background:var(--surface); font-size:16px; line-height:1.55; overflow-wrap:anywhere}
.trap{margin-top:12px; padding:14px 16px; border:2px solid var(--gold); border-radius:16px; background:var(--gold-tint)}
.trap b{display:block; font:700 11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-bottom:2px}
.dock{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:2px solid var(--line); padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock.ok{background:var(--ok-bg); border-color:var(--ok)} .dock.bad{background:var(--bad-bg); border-color:var(--bad)}
.dock-in{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
.dock-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fb strong{display:block; font:800 20px var(--f-display)}
.dock.ok .fb strong{color:var(--ok)} .dock.bad .fb strong{color:var(--bad)}
.fb p{font-size:15px; margin-top:2px}

.center{text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; padding:48px 0 24px}
.center h1{font-size:34px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.stat{padding:12px 8px; border:2px solid var(--line); border-radius:16px; background:var(--surface)}
.stat b{display:block; font:700 24px var(--f-mono)}
.stat span{font:700 11px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
.bigstars{display:flex; gap:6px; font-size:44px; color:var(--gold)} .bigstars .off{color:var(--locked)}
.scene{font-size:17px}

textarea{width:100%; min-height:220px; resize:vertical; padding:14px; border:2px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); font:400 16px/1.5 var(--f-body)}
textarea:focus{border-color:var(--accent); outline:none}
.wc{font:700 12px var(--f-mono); color:var(--ink-2); margin:6px 0 16px; text-align:right}
.chk{display:flex; flex-direction:column; gap:10px; margin:14px 0 20px}
.chk label{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:var(--surface); cursor:pointer; font-size:15px}
.chk input{width:22px; height:22px; margin-top:1px; accent-color:var(--accent); flex:none}
.chk label:has(input:checked){border-color:var(--ok); background:var(--ok-bg)}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:14px; font:600 14px var(--f-body); opacity:0; pointer-events:none; transition:.25s; z-index:20; max-width:calc(100% - 32px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="wrap">
  <header class="bar" id="bar"></header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ============ CONTEÚDO ============ */
const UNITS=[
 {n:1,title:'Princípios e organização',sub:'Regime jurídico, LIMPE, órgãos e descentralização'},
 {n:2,title:'Administração Indireta',sub:'Autarquias, estatais, fundações e agências'},
 {n:3,title:'Poderes administrativos',sub:'Hierárquico, disciplinar, regulamentar e de polícia'},
 {n:4,title:'Atos administrativos',sub:'Elementos, atributos, vícios e extinção'},
 {n:5,title:'Serviços públicos',sub:'Concessão, permissão, autorização e PPP'},
 {n:6,title:'Agentes públicos I',sub:'Ingresso, concurso e cargos em comissão'},
 {n:7,title:'Agentes públicos II',sub:'Remuneração, acumulação e estabilidade'},
 {n:8,title:'Lei 8.112/1990',sub:'Provimento, vacância, remoção e redistribuição'}
];
// Cartas geradas dos seus 8 resumos (pergunta, resposta e armadilha da banca).
const CARDS={"5": [{"id": "5-1", "q": "A quem pertence a titularidade do serviço público e como pode ser prestado (art. 175)?", "a": "Sempre ao Estado. Prestação direta (Administração Direta ou Indireta) ou indireta (delegação a particulares por concessão, permissão ou autorização). Na prestação indireta, transfere-se só a execução; o Estado mantém a titularidade e o dever de regulamentar e fiscalizar.", "t": "Dizer que a delegação transfere a titularidade."}, {"id": "5-2", "q": "Quais são as escolas do conceito de serviço público e qual o Brasil adota?", "a": "Essencialista (materialista): importância crucial para a população. Subjetivista: pelo sujeito que presta (não adotada, pois particulares prestam por delegação). Formalista (legalista): é a adotada; serviço público é a atividade que o ordenamento determina prestar sob regime de direito público.", "t": "Atribuir ao Brasil a escola subjetivista."}, {"id": "5-3", "q": "Qual o conceito de serviço público de Celso Antônio Bandeira de Mello?", "a": "Atividade de oferecimento de utilidade ou comodidade fruível singularmente pelos administrados, assumida pelo Estado sob regime de direito público para satisfazer a coletividade.", "t": "Esquecer a fruição singular ou o regime de direito público."}, {"id": "5-4", "q": "Quais os princípios do serviço público (Celso Antônio), parte 1?", "a": "Dever inescusável do Estado; supremacia do interesse público; adaptabilidade (atualidade): modernização constante; universalidade (generalidade): maior amplitude de usuários; impessoalidade: proibição de discriminação entre usuários.", "t": "Trocar adaptabilidade por universalidade."}, {"id": "5-5", "q": "Quais os princípios do serviço público (Celso Antônio), parte 2?", "a": "Continuidade; transparência (liberar o máximo de informações); motivação (fundamentar as decisões); modicidade das tarifas (valores acessíveis); controle (fiscalização permanente pelo poder concedente, MP e Tribunais de Contas).", "t": "Esquecer o controle como princípio."}, {"id": "5-6", "q": "Em quais casos o serviço pode ser interrompido sem ferir a continuidade?", "a": "Emergência; razões de ordem técnica ou segurança (com aviso prévio); inadimplência do usuário (com aviso prévio e considerado o interesse coletivo).", "t": "Admitir interrupção sem aviso prévio fora da emergência."}, {"id": "5-7", "q": "Diferencie serviços gerais (uti universi) e singulares (uti singuli).", "a": "Gerais: à coletividade indistintamente, uso não mensurável individualmente (iluminação pública, segurança nacional); não remunerados por taxa. Singulares: uso mensurável por usuário (energia, água); remunerados por taxa ou tarifa.", "t": "Cobrar taxa por serviço geral."}, {"id": "5-8", "q": "Diferencie serviços delegáveis e indelegáveis.", "a": "Indelegáveis: próprios do Estado (poder de polícia, defesa nacional, Judiciário). Delegáveis: podem ser prestados pela iniciativa privada por concessão, permissão ou autorização (transporte público, telefonia).", "t": "Delegar o poder de polícia."}, {"id": "5-9", "q": "Diferencie serviços próprios e impróprios.", "a": "Próprios: sob regime de direito público, comodidade direta à população. Impróprios: serviços sociais que a iniciativa privada presta sem delegação formal, regidos pelo direito privado (hospitais e escolas particulares). Outra vertente define impróprios como os que não afetam substancialmente as necessidades da comunidade e são delegáveis.", "t": "Aplicar direito público aos impróprios."}, {"id": "5-10", "q": "O que é concessão e quais seus subtipos?", "a": "Delegação formalizada por contrato administrativo, para serviços que exigem investimentos vultosos. Subtipos: concessão comum (tarifa do usuário); concessão de obra pública (investimento recuperado pela exploração do serviço ou da obra, ex.: rodovia com pedágio); PPPs: patrocinada (tarifa + subsídio estatal) e administrativa (o Estado é o usuário e paga o prestador).", "t": "Dizer que a PPP administrativa é paga por tarifa do usuário."}, {"id": "5-11", "q": "Quais as regras da concessão quanto a licitação, sujeitos, prazo e natureza?", "a": "Licitação: concorrência ou diálogo competitivo (exceção: leilão para transferência de controle acionário; possível inexigibilidade se a disputa for inviável). Sujeitos: só pessoa jurídica ou consórcio. Prazo: sempre determinado. Natureza: contrato administrativo bilateral, sem precariedade.", "t": "Admitir pessoa física como concessionária."}, {"id": "5-12", "q": "Como é a permissão de serviço público?", "a": "Delegação para serviços de porte médio, por contrato de adesão; a lei a define como precária e revogável unilateralmente. Sempre exige licitação, sem modalidade específica. Pode ser outorgada a pessoa física ou jurídica. Prazo, em regra, determinado.", "t": "Dispensar licitação na permissão."}, {"id": "5-13", "q": "Como é a autorização de serviço público?", "a": "Ato administrativo unilateral, em regra discricionário e precário (sem indenização), fundamentado diretamente na CF (ex.: telecomunicações, radiodifusão). Não exige licitação nem lei autorizativa prévia; pode ter prazo indeterminado. Exceção: em telecomunicações é ato vinculado.", "t": "Exigir licitação para a autorização."}, {"id": "5-14", "q": "Compare concessão, permissão e autorização.", "a": "Formalização: contrato administrativo, contrato de adesão e ato administrativo. Licitação: obrigatória (concorrência/diálogo), obrigatória (qualquer modalidade) e não exige. Natureza: bilateral não precária, bilateral precária e unilateral precária. Pessoa física: não, sim, sim. Prazo: sempre determinado, geralmente determinado, pode ser indeterminado. Lei autorizativa: exige, exige, não exige.", "t": "Misturar as colunas de permissão e autorização."}, {"id": "5-15", "q": "Quando é dispensada a lei autorizativa para concessão e permissão?", "a": "Regra: lei autorizativa específica. Exceções: saneamento básico, limpeza urbana e serviços previstos para delegação na CF, nas constituições estaduais e nas leis orgânicas.", "t": "Exigir lei específica sem exceções."}, {"id": "5-16", "q": "Quais os critérios de julgamento e peculiaridades da licitação de concessão?", "a": "Menor valor da tarifa, maior oferta pela outorga, melhor proposta técnica ou combinação; preferência por empresas brasileiras. O edital pode prever a inversão das fases de habilitação e julgamento. O contrato pode prever arbitragem.", "t": "Vedar a arbitragem ou a inversão de fases."}, {"id": "5-17", "q": "O que é serviço público adequado?", "a": "O que satisfaz regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas.", "t": "Omitir cortesia ou atualidade."}, {"id": "5-18", "q": "Como funciona a intervenção na concessão?", "a": "O poder concedente assume temporariamente o serviço por decreto (com interventor, prazo, objetivos e limites). Deve instaurar processo administrativo em 30 dias e concluí-lo em até 180 dias, sob pena de invalidade. A indenização continua possível.", "t": "Trocar os prazos de 30 e 180 dias."}, {"id": "5-19", "q": "Quais as formas de extinção da concessão?", "a": "Advento do termo; encampação; caducidade; rescisão; anulação; falência ou falecimento. Extinta, os bens necessários à continuidade revertem ao patrimônio do poder público (reversão).", "t": "Esquecer a reversão dos bens."}, {"id": "5-20", "q": "Diferencie encampação, caducidade e rescisão.", "a": "Encampação: retomada por interesse público, com lei autorizativa específica e indenização prévia. Caducidade: inexecução total ou parcial por culpa da concessionária (ou transferência sem anuência prévia). Rescisão: iniciativa da concessionária por inadimplência do Estado, obrigatoriamente por ação judicial.", "t": "Fazer a concessionária rescindir sem ação judicial."}, {"id": "5-21", "q": "Como se mantém o equilíbrio econômico-financeiro e a modicidade nas tarifas?", "a": "Modicidade: tarifas acessíveis, para permitir acesso universal. Equilíbrio: o valor deve cobrir custos e garantir o lucro da concessionária contra inflação ou imprevistos, com cláusulas de revisão e reajuste previstas no contrato.", "t": "Tratar modicidade e equilíbrio como incompatíveis."}], "7": [{"id": "7-1", "q": "Quais os cinco requisitos cumulativos da contratação temporária (RE 658.026)?", "a": "Previsão em lei dos casos excepcionais; prazo predeterminado; necessidade temporária (não permanente); excepcional interesse público; indispensabilidade. Vedada para serviços ordinários permanentes sob contingências normais, salvo substituição temporária (surto de doenças, licença-maternidade).", "t": "Usar temporário para rotina permanente de saúde ou educação."}, {"id": "7-2", "q": "Qual o vínculo, o regime e a Justiça competente dos temporários?", "a": "Função pública autônoma (não cargo nem emprego); vínculo contratual de direito público, em regime especial (não é RJU nem CLT); Justiça Comum (Federal ou Estadual), não a do Trabalho. Seleção por processo seletivo simplificado (pode ser dispensado em calamidade).", "t": "Atribuir litígios à Justiça do Trabalho."}, {"id": "7-3", "q": "Quais os direitos dos temporários (Tema 551) e o que mais se aplica?", "a": "Regra: sem 13º e sem terço de férias. Exceções: previsão em lei local ou contrato, ou desvirtuamento por prorrogações ilegais sucessivas. FGTS só em contratos nulos. Quarentena de 24 meses entre contratos é constitucional. A gestante tem licença-maternidade e estabilidade provisória.", "t": "Conceder 13º e terço de férias como regra."}, {"id": "7-4", "q": "Como diferenciar processo seletivo simplificado e processo seletivo público?", "a": "Simplificado: para temporários. Público: exclusivo de agentes comunitários de saúde e de combate a endemias (ACS/ACE), que não são temporários.", "t": "Trocar os dois."}, {"id": "7-5", "q": "Qual a regra geral e os requisitos de acumulação de cargos?", "a": "Vedada, em toda a Administração direta e indireta (inclui empresas, subsidiárias e controladas). Só a CF abre exceções, com compatibilidade de horários (sem limite máximo de horas fixado), no máximo dois vínculos e observância do teto aferido em cada vínculo isoladamente. Vínculo privado, em regra, não é vedado.", "t": "Somar as remunerações para o teto."}, {"id": "7-6", "q": "Quais as hipóteses permitidas de acumulação?", "a": "Dois cargos de professor; um de professor com um técnico ou científico; dois cargos ou empregos privativos de profissionais de saúde com profissão regulamentada. Também: vereador com cargo efetivo (se houver compatibilidade de horário); juízes e membros do MP podem exercer um magistério. Técnico: exige conhecimento específico e habilitação profissional; científico: pesquisa e ampliação do conhecimento.", "t": "Admitir qualquer cargo técnico com técnico."}, {"id": "7-7", "q": "Como fica a acumulação de proventos de aposentadoria?", "a": "Regra: proibido acumular proventos do RPPS com remuneração de novo cargo ou duas aposentadorias do RPPS. Exceções: cargos acumuláveis na ativa, cargos eletivos e cargos em comissão. Quem se aposentou pelo RGPS pode ocupar qualquer cargo público e acumular sem essas restrições.", "t": "Estender a vedação ao aposentado pelo INSS."}, {"id": "7-8", "q": "Como fica o servidor que exerce mandato eletivo?", "a": "Federal, estadual ou distrital: afasta-se e recebe só o subsídio. Prefeito: afasta-se e opta pela remuneração mais vantajosa. Vereador: com compatibilidade de horários, acumula e recebe as duas remunerações; sem compatibilidade, afasta-se e opta. Tempo de serviço conta para todos os efeitos, exceto promoção por merecimento; mantém o regime previdenciário de origem.", "t": "Acumular remuneração de prefeito e de cargo."}, {"id": "7-9", "q": "Quais as modalidades de retribuição dos agentes?", "a": "Remuneração (vencimento básico + vantagens permanentes), subsídio (parcela única, sem acréscimos), salário (empregados públicos, CLT), proventos (aposentados) e pensão.", "t": "Admitir gratificação somada ao subsídio."}, {"id": "7-10", "q": "O subsídio é obrigatório para quem e quais parcelas permite?", "a": "Obrigatório: membros de Poder (Chefes do Executivo, magistrados, MP), mandatários eletivos, ministros e secretários, advocacia pública, Defensoria e carreiras policiais. Facultativo: servidores organizados em carreira. Permite indenizações (diárias), 13º, terço de férias, adicional noturno e hora-extra.", "t": "Vedar 13º e terço de férias no subsídio."}, {"id": "7-11", "q": "Como se fixa e altera a remuneração e o que diz a revisão geral anual?", "a": "Só por lei específica, com iniciativa privativa de cada Poder. SV 37: o Judiciário não aumenta vencimentos por isonomia. Revisão geral anual: mesma data e índice para todos; o Judiciário não obriga o Executivo, bastando justificativa fundamentada para a não concessão.", "t": "Aumentar vencimento por decisão judicial fundada em isonomia."}, {"id": "7-12", "q": "Qual o teto constitucional e os subtetos?", "a": "Teto: subsídio dos Ministros do STF. Municípios: subsídio do Prefeito. Estados e DF: Executivo (Governador), Legislativo (Deputados Estaduais), Judiciário, MP, Procuradores e Defensores (Desembargadores do TJ, até 90,25% do STF). Procuradores municipais: até 90,25% do STF. Juízes estaduais e federais: limitados ao STF.", "t": "Usar o subsídio do Governador como teto do Judiciário estadual."}, {"id": "7-13", "q": "Como o teto se aplica a acumulações, pensões e estatais?", "a": "Acumulações lícitas: aferido em cada vínculo, sem somar. Pensão (morte do instituidor): soma-se ao teto. Estatais: só as dependentes (que recebem recursos para pessoal ou custeio); não se aplica a Petrobras, Banco do Brasil e Caixa. Direta, autarquias e fundações: sempre.", "t": "Aplicar o teto a toda estatal."}, {"id": "7-14", "q": "O que são efeito cascata, irredutibilidade e suas exceções?", "a": "Efeito cascata vedado: acréscimos incidem só sobre o vencimento básico. Irredutibilidade: protege o valor nominal total, não a composição das parcelas; pode alterar a composição. Exceções: teto (abate-teto), efeito cascata, migração para subsídio (valor total nominal preservado), aumento de imposto. Não pode haver aumento de jornada sem aumento de remuneração.", "t": "Garantir direito adquirido à composição das parcelas."}, {"id": "7-15", "q": "O que veda a SV 42 e quanto às gratificações de cargo em comissão?", "a": "É vedado vincular o aumento de uma carreira ao de outra ou a índices federais de correção monetária (aumento automático vertical, horizontal ou por índices). É vedado incorporar gratificações de cargo em comissão ou função de confiança à remuneração do efetivo: saiu do cargo, perdeu a gratificação.", "t": "Permitir incorporação da gratificação de função."}, {"id": "7-16", "q": "Como funcionam o salário mínimo do servidor e as SVs 15 e 16?", "a": "SV 16: o salário mínimo se refere ao total da remuneração, e o vencimento básico pode ser inferior. SV 15: gratificações não incidem sobre o abono usado para atingir o mínimo, só sobre o vencimento básico. Em jornada reduzida (ex.: 20h) não se paga menos que o mínimo. É vedada a vinculação do mínimo para qualquer fim.", "t": "Usar o salário mínimo como indexador de vantagem."}, {"id": "7-17", "q": "Como são as licenças gestante e paternidade e os direitos correlatos?", "a": "Gestante: 120 dias + 60 de prorrogação; vale para comissionadas e temporárias, com estabilidade da confirmação até 5 meses após o parto. Paternidade: mínimo de 5 dias enquanto não houver lei; igual para filho biológico ou adotivo, sem distinção de idade; sem mãe, o pai tem 120+60 dias. Casal de mulheres: a não gestante tem direito se a companheira não usou; se usou, tem o período da paternidade.", "t": "Diferenciar prazo de adoção pela idade da criança."}, {"id": "7-18", "q": "Quais outros direitos sociais aparecem na CF para servidores?", "a": "13º salário, adicional noturno, salário-família, jornada de 8h diárias e 44h semanais, repouso semanal remunerado, hora-extra com no mínimo 50%, férias com 1/3, proteção do mercado de trabalho da mulher, saúde e segurança, e proibição de discriminação por sexo, idade, cor ou estado civil.", "t": "Trocar o adicional da hora-extra."}, {"id": "7-19", "q": "Qual o direito de sindicalização e de greve?", "a": "Servidores civis têm livre associação sindical; militares não. Greve (art. 37, VII): norma de eficácia limitada; na omissão do Congresso, aplica-se a Lei 7.783/1989; atividades essenciais podem ter regime mais severo. Proibida a militares (art. 142) e, segundo o STF, a todos os que atuam diretamente em segurança pública (policiais civis, federais, rodoviários e penais).", "t": "Admitir greve de policiais com contingente mínimo."}, {"id": "7-20", "q": "Qual o efeito da greve sobre a remuneração?", "a": "Regra: a Administração deve descontar os dias parados, sem processo administrativo prévio. Exceção: greve provocada por conduta ilícita do Poder Público (ex.: atraso de salários); a falta de revisão geral anual não é conduta ilícita. Compensação de horas por acordo; sem acordo, desconto parcelado (mínimo de 10% da remuneração, por analogia à Lei 8.112).", "t": "Tornar o desconto facultativo ou condicionado a processo."}, {"id": "7-21", "q": "Como a greve afeta o servidor em estágio probatório e quem julga a abusividade?", "a": "Adesão a greve não abusiva não é falta grave nem fato desabonador; mesmo com mais de 30 dias, não vira falta injustificada nem permite demissão por abandono de cargo. A abusividade é julgada pela Justiça Comum (Federal ou Estadual), mesmo para celetistas da Direta, autarquias e fundações.", "t": "Mandar a abusividade à Justiça do Trabalho."}, {"id": "7-22", "q": "Qual o regime previdenciário dos agentes e quais as modalidades de aposentadoria no RPPS?", "a": "RPPS: titulares de cargo efetivo e vitalícios. RGPS: empregados públicos, temporários, mandatários eletivos e ocupantes exclusivos de cargo em comissão; os estabilizados sem concurso pelo art. 19 do ADCT também. Aposentadoria: por incapacidade permanente, compulsória aos 75 anos (não alcança cargo exclusivamente comissionado) e voluntária (na União, 62 anos mulheres e 65 homens).", "t": "Submeter o comissionado exclusivo à compulsória de 75 anos."}, {"id": "7-23", "q": "Qual a diferença entre estabilidade e estágio probatório?", "a": "Estabilidade: concurso + 3 anos de efetivo exercício + avaliação especial de desempenho; adquirida no serviço público. Estágio probatório: período de avaliação para cada cargo, com 36 meses segundo o STF. Servidor já estável que passa em novo concurso no mesmo ente cumpre novo estágio e pode ser considerado estável antes de concluí-lo.", "t": "Usar o prazo de 24 meses para o estágio."}, {"id": "7-24", "q": "Quando o servidor estável perde o cargo?", "a": "(1) Sentença judicial transitada em julgado; (2) PAD com ampla defesa (pode produzir efeitos mesmo sujeito a recurso); (3) avaliação periódica de desempenho (lei complementar ainda não editada); (4) excesso de despesa com pessoal (art. 169): medida subsidiária, após reduzir ao menos 20% dos cargos em comissão e exonerar não estáveis; indenização de um mês por ano de serviço; cargo extinto e vedada criação de cargo igual por 4 anos.", "t": "Esquecer que a avaliação periódica depende de lei complementar."}, {"id": "7-25", "q": "O que é vitaliciedade?", "a": "Proteção máxima: só se perde o cargo por sentença judicial transitada em julgado. Própria de magistrados, membros do MP e ministros de Tribunais de Contas. Juízes de 1º grau e promotores a adquirem após 2 anos; ministros de Tribunais Superiores, na posse.", "t": "Admitir perda por PAD."}, {"id": "7-26", "q": "Como são as responsabilidades civil, penal e administrativa e quando se comunicam?", "a": "Instâncias independentes e acumuláveis. A absolvição criminal só vincula as demais se negar a existência do fato ou a autoria; falta de provas, atipicidade ou ausência de culpabilidade não afastam. Súmula 18 do STF: pode haver punição por falta residual não compreendida na absolvição. Civil: o Estado indeniza e move ação regressiva (responsabilidade subjetiva do servidor); a obrigação alcança os sucessores até o limite da herança.", "t": "Estender a absolvição por falta de provas às esferas civil e administrativa."}, {"id": "7-27", "q": "Diferencie reintegração, recondução e aproveitamento.", "a": "Reintegração: retorno do estável ao cargo quando a demissão é invalidada, com ressarcimento total. Recondução: retorno do estável ao cargo anterior por inabilitação ou desistência em estágio de outro cargo, ou pela reintegração do ocupante anterior (sem indenização). Aproveitamento: reingresso do servidor em disponibilidade quando surge vaga com atribuições e vencimentos compatíveis.", "t": "Trocar recondução e reintegração."}], "4": [{"id": "4-1", "q": "O que é ato administrativo e como se distingue do ato da Administração?", "a": "Ato administrativo: declaração unilateral de vontade do Estado (ou delegatários), sob regime de direito público, com efeitos jurídicos imediatos e sujeita a controle judicial (espécie). Ato da Administração: gênero amplo, que inclui atos de direito privado, atos materiais, atos políticos, contratos, enunciativos e os atos administrativos propriamente ditos.", "t": "Dizer que o ato administrativo é o gênero e abrange atos privados."}, {"id": "4-2", "q": "Diferencie ato administrativo e fato administrativo.", "a": "Ato: manifestação de vontade. Fato administrativo: execução material (limpeza de rua, demolição) ou evento da natureza que gera efeitos no Direito Administrativo (morte de servidor gera vacância). Ex.: a ordem de demolição é o ato; a demolição física é o fato.", "t": "Trocar a decisão pela sua execução material."}, {"id": "4-3", "q": "O silêncio administrativo é ato administrativo?", "a": "Não: falta manifestação de vontade; é fato jurídico administrativo. Seus efeitos (anuência ou negativa tácita) dependem de previsão legal. Sem previsão, o silêncio não produz efeitos, e o administrado recorre ao Judiciário: em ato vinculado, o juiz fixa prazo ou defere; em discricionário, só determina decisão motivada.", "t": "Tratar o silêncio como ato administrativo ou presumir deferimento sem lei."}, {"id": "4-4", "q": "Quais os elementos de validade do ato (COMFIFORMOB) e a natureza de cada um?", "a": "Competência, Finalidade, Forma, Motivo e Objeto. Competência, finalidade e forma: sempre vinculados. Motivo e objeto: vinculados ou discricionários (o mérito incide só neles).", "t": "Dizer que no ato discricionário todos os elementos são livres."}, {"id": "4-5", "q": "Quais as características da competência e da delegação?", "a": "Competência: poder legal conferido ao agente; irrenunciável, imprescritível, imodificável, intransferível, mas admite delegação e avocação; sempre vinculada; vício sanável (salvo competência exclusiva ou em razão da matéria). Delegação: transfere a execução, titularidade permanece, independe de hierarquia, revogável a qualquer momento; não se delega o que a lei impede (CENORA).", "t": "Dizer que a competência se perde pelo não uso."}, {"id": "4-6", "q": "Como é a finalidade do ato e que vício a atinge?", "a": "Objetivo do ato: geral (interesse público) e específica (fim previsto em lei); sempre vinculada; manifestação da impessoalidade. O desvio de finalidade (ou de poder) é vício insanável.", "t": "Admitir convalidação do desvio de finalidade."}, {"id": "4-7", "q": "Como é a forma do ato (sentidos estrito e amplo)?", "a": "Estrito: modo de exteriorização (escrita, decreto, portaria). Amplo: procedimento (formalidades) + meio de exteriorização (devido processo legal; publicidade, contraditório, notificação). Regra: forma escrita; admite gestos e sinais (semáforo). Sempre vinculada; vício sanável, salvo forma essencial.", "t": "Considerar a forma discricionária."}, {"id": "4-8", "q": "Diferencie motivo e motivação.", "a": "Motivo: pressupostos de fato e de direito que autorizam o ato (elemento essencial, causa). Motivação: exposição escrita do porquê, que integra o elemento forma. Ausência de motivação obrigatória é vício de forma. Ex.: dispensa de licitação emergencial sem explicar o porquê.", "t": "Dizer que a falta de motivação invalida o elemento motivo."}, {"id": "4-9", "q": "O que diz a teoria dos motivos determinantes?", "a": "Se a Administração motiva o ato (mesmo sem obrigação, como na exoneração ad nutum), a validade fica vinculada à veracidade dos motivos expostos. Aplica-se a atos vinculados e discricionários. Motivo falso ou inexistente torna o ato nulo (inclusive o ato de revogação ou anulação).", "t": "Dizer que a exoneração ad nutum não se sujeita à teoria."}, {"id": "4-10", "q": "Como é o objeto do ato e quais seus requisitos?", "a": "Efeito jurídico imediato (o que o ato decide). Deve ser lícito, possível, certo e moral. Pode ser vinculado (licença-paternidade de 5 dias) ou discricionário (suspensão ou multa). Vício insanável.", "t": "Confundir objeto (fim imediato) com finalidade (resultado desejado)."}, {"id": "4-11", "q": "O que é mérito administrativo e onde incide?", "a": "Juízo de conveniência e oportunidade, margem de escolha entre soluções legalmente válidas; só existe em atos discricionários e incide na valoração do motivo e na escolha do objeto. Atos vinculados não têm mérito.", "t": "Dizer que o mérito alcança competência, finalidade e forma."}, {"id": "4-12", "q": "Quem controla o mérito e como fica o controle judicial?", "a": "A Administração, por autotutela, pode manter ou revogar. O Judiciário não controla mérito (só legalidade e juridicidade), mas pode anular atos discricionários que extrapolem a lei ou sejam arbitrários e desarrazoados, pois isso é ilegalidade.", "t": "Dizer que o Judiciário revoga atos por inconveniência."}, {"id": "4-13", "q": "Quais são os atributos do ato administrativo (PATI) e quais são universais?", "a": "Presunção de legitimidade, Autoexecutoriedade, Tipicidade e Imperatividade. Universais: presunção de legitimidade/veracidade e tipicidade. Autoexecutoriedade e imperatividade existem só em alguns atos.", "t": "Dizer que imperatividade e autoexecutoriedade existem em todos os atos."}, {"id": "4-14", "q": "Como funciona a presunção de legitimidade?", "a": "Presume-se que o ato segue a lei e os fatos são verdadeiros; produz efeitos até a decretação da invalidade. Gera inversão do ônus da prova contra o particular (não é regra). Não é absoluta: ordens manifestamente ilegais não devem ser cumpridas.", "t": "Considerá-la absoluta."}, {"id": "4-15", "q": "Quando há autoexecutoriedade e como se distinguem exigibilidade e executoriedade?", "a": "Quando há previsão em lei (ex.: apreensão de mercadorias) ou urgência (demolição de imóvel em risco de desabamento). Não afasta o controle judicial. Exigibilidade: meios indiretos (multa de trânsito). Executoriedade: meios diretos de força (sinônimo de autoexecutoriedade).", "t": "Achar que a autoexecutoriedade impede o controle judicial."}, {"id": "4-16", "q": "O que é a tipicidade e a quais atos se aplica?", "a": "O ato deve corresponder a figuras previamente definidas em lei (legalidade); não existem atos unilaterais inominados. Aplica-se só a atos unilaterais; contratos, por serem bilaterais, podem ser inominados.", "t": "Aplicar a tipicidade aos contratos administrativos."}, {"id": "4-17", "q": "O que é imperatividade?", "a": "Capacidade de impor obrigações ou restrições a terceiros independentemente de concordância (poder extroverso). Depende de previsão legal; não está presente nos atos que concedem direitos, nos negociais e nos enunciativos.", "t": "Estendê-la a atos negociais e enunciativos."}, {"id": "4-18", "q": "Quais são os vícios de competência?", "a": "Excesso de poder (agente competente extrapola os limites; em regra sanável, exceto competência exclusiva ou em razão da matéria); função de fato (investidura irregular, mas ato válido perante terceiros de boa-fé, pela teoria da aparência); usurpação de função (quem não tem vínculo algum; crime; ato inexistente); incapacidade (impedimento ou suspeição).", "t": "Considerar válido o ato do usurpador de função."}, {"id": "4-19", "q": "Como são os vícios de motivo e de objeto?", "a": "Motivo: falso, inexistente ou juridicamente inadequado (ex.: demitir por ser “muito alto”); insanável. Objeto: proibido ou não previsto em lei, diverso do previsto, impossível, imoral ou incerto; insanável.", "t": "Convalidar vício de motivo ou de objeto."}, {"id": "4-20", "q": "Como se classificam os atos quanto à formação da vontade?", "a": "Simples (vontade de um único órgão, unipessoal ou colegiado); complexo (conjugação de vontades de dois ou mais órgãos num único ato, ex.: aposentadoria); composto (ato principal que depende de ato acessório, como visto, aprovação ou homologação, para ter eficácia).", "t": "Trocar complexo e composto."}, {"id": "4-21", "q": "Como se classificam os atos quanto aos efeitos, à eficácia e à exequibilidade?", "a": "Efeitos: constitutivo, modificativo, extintivo, declaratório. Eficácia: válido, nulo (vício insanável), anulável (vício sanável), inexistente. Exequibilidade: perfeito, imperfeito, eficaz, pendente, consumado.", "t": "Chamar de nulo o ato com vício sanável."}, {"id": "4-22", "q": "O que são atos normativos e ordinatórios?", "a": "Normativos: comandos gerais e abstratos, secundários, sem inovar (exceto decreto autônomo); ex.: decretos, regulamentos, resoluções, instruções normativas. Ordinatórios: disciplinam o funcionamento interno e a conduta funcional, com base no poder hierárquico e alcance interno; ex.: portarias, circulares, ordens de serviço, ofícios, despachos.", "t": "Atribuir alcance externo aos ordinatórios."}, {"id": "4-23", "q": "Como se diferenciam licença, autorização e permissão (LAP)?", "a": "Licença: unilateral, vinculada, definitiva (pode ser cassada ou anulada, não livremente revogada); ex.: dirigir, construir. Autorização: unilateral, discricionária e precária, interesse predominantemente do particular. Permissão: unilateral, discricionária e precária, interesse predominantemente público; pode ser ato ou contrato (delegação de serviço por licitação). Sem indenização na revogação, em regra.", "t": "Dizer que a licença é discricionária ou livremente revogável."}, {"id": "4-24", "q": "Quais são os atos enunciativos (CAPA)?", "a": "Certidões, Atestados, Pareceres e Apostilas: a Administração declara fato preexistente ou emite opinião, sem criar direitos ou obrigações; são atos administrativos só em sentido formal.", "t": "Atribuir imperatividade aos enunciativos."}, {"id": "4-25", "q": "O que são atos punitivos e de que poderes derivam?", "a": "Reprimem infrações de servidores (sanções internas: advertência, suspensão, demissão, cassação de aposentadoria; poder disciplinar) e de particulares (sanções externas: multas, interdição, destruição de coisas; poder de polícia).", "t": "Atribuir multa ao poder disciplinar."}, {"id": "4-26", "q": "Quais são as formas de extinção natural do ato?", "a": "Natural (cumpre a finalidade), subjetiva (desaparece o beneficiário), objetiva (desaparece o objeto) e renúncia (o beneficiário abre mão voluntariamente).", "t": "Confundir com anulação ou revogação."}, {"id": "4-27", "q": "Compare anulação e revogação.", "a": "Anulação: ilegalidade; efeitos ex tunc; Administração ou Judiciário. Revogação: mérito; efeitos ex nunc; só a Administração; atinge ato válido, eficaz e discricionário. Mnemônico: tapa na testa (cabeça para trás, ex tunc); tapa na nuca (cabeça para frente, ex nunc).", "t": "Dizer que a revogação retroage."}, {"id": "4-28", "q": "Defina cassação, caducidade e contraposição.", "a": "Cassação: descumprimento de regras pelo beneficiário (vinculada, sancionatória, em regra ex nunc). Caducidade: lei nova torna proibida a situação anterior, cessando a eficácia. Contraposição (derrubada): novo ato de efeitos opostos (exoneração contra nomeação).", "t": "Chamar de revogação a retirada da licença por descumprimento."}, {"id": "4-29", "q": "O que não pode ser revogado?", "a": "Atos vinculados, atos que já exauriram os efeitos, enunciativos (certidões e pareceres), atos que geraram direito adquirido e atos de procedimento (preclusão).", "t": "Revogar licença, que é ato vinculado."}, {"id": "4-30", "q": "Qual o prazo para a Administração federal anular atos favoráveis?", "a": "5 anos, para atos favoráveis a destinatários de boa-fé, salvo má-fé e atos de efeito desfavorável. Atos flagrantemente inconstitucionais não se submetem ao prazo (STF).", "t": "Aplicar o prazo à má-fé."}, {"id": "4-31", "q": "O que é convalidação, seus requisitos e vícios sanáveis (FoCo)?", "a": "Saneamento de atos com vício sanável, com efeitos ex tunc; abrange atos vinculados e discricionários. Requisitos: sem lesão ao interesse público nem prejuízo a terceiros, e vício sanável. Sanáveis: Forma (se não essencial) e Competência (se não exclusiva nem em razão da matéria). Finalidade, motivo e objeto: em regra insanáveis.", "t": "Convalidar finalidade ou motivo."}], "2": [{"id": "2-1", "q": "Quais são as características comuns a toda a Administração Indireta?", "a": "Personalidade jurídica própria, patrimônio e receita próprios, autonomia técnica, administrativa e financeira (sem autonomia política); vinculação à Direta (sem hierarquia); especialidade; observância do LIMPE; concurso público e dever de licitar (em regra); vedação de acumulação; controle do Tribunal de Contas e do Legislativo; agentes tratados como públicos para improbidade e equiparados a funcionários públicos para fins penais.", "t": "Atribuir autonomia política ou legislativa às entidades."}, {"id": "2-2", "q": "Quais entidades são criadas por lei e quais têm a criação autorizada por lei?", "a": "Criadas por lei específica: autarquias e fundações públicas de direito público. Autorizadas por lei específica: empresas públicas, sociedades de economia mista e fundações de direito privado, que só nascem com o registro dos atos constitutivos.", "t": "Inverter quais são criadas e quais são autorizadas."}, {"id": "2-3", "q": "Como é a autarquia quanto à natureza, criação e atividade?", "a": "Direito público; criada por lei específica de iniciativa privativa do Chefe do Executivo; adquire personalidade com a vigência da lei, sem registro em cartório; exerce atividade típica de Estado (INSS, Bacen, universidades). Extinção também por lei específica (paralelismo).", "t": "Exigir registro em cartório para a autarquia."}, {"id": "2-4", "q": "Quais são as prerrogativas das autarquias?", "a": "Imunidade tributária recíproca (patrimônio, renda e serviços vinculados às finalidades essenciais); bens públicos (impenhoráveis, imprescritíveis, alienação restrita); precatórios (art. 100); prazo em dobro e duplo grau obrigatório; prescrição quinquenal das dívidas.", "t": "Estender essas prerrogativas a EP e SEM exploradoras de atividade econômica."}, {"id": "2-5", "q": "Como é o regime de pessoal e a responsabilidade civil das autarquias?", "a": "Concurso obrigatório; regime estatutário (predominante) ou celetista. Responsabilidade objetiva (risco administrativo, art. 37, §6º). Autarquias federais: Justiça Federal; estaduais ou municipais: Justiça Estadual. Lides de pessoal celetista: Justiça do Trabalho.", "t": "Exigir culpa ou dolo na responsabilidade da autarquia."}, {"id": "2-6", "q": "O que são agências reguladoras e qual a regra de seus dirigentes?", "a": "Autarquias em regime especial, com maior independência frente ao poder central. Dirigentes: mandato fixo (na esfera federal, 5 anos, vedada a recondução), sem exoneração ad nutum (só perdem o cargo por renúncia, condenação transitada em julgado ou PAD) e quarentena de 6 meses com remuneração compensatória.", "t": "Dizer que o Presidente pode exonerar livremente os dirigentes."}, {"id": "2-7", "q": "Como é o controle sobre as agências reguladoras?", "a": "Não há tutela nem hierarquia com o Ministério, apenas vinculação. Admite-se recurso hierárquico impróprio apenas se a agência fugir de suas finalidades legais. Exercem regulação e fiscalização de serviços públicos (Anatel, Anvisa) e poder de polícia em atividades privadas.", "t": "Admitir recurso hierárquico impróprio como regra."}, {"id": "2-8", "q": "O que é agência executiva?", "a": "Não é nova entidade: é título ou qualificação dada a autarquias ou fundações que celebram contrato de gestão, concedida de forma discricionária se preenchidos os requisitos legais.", "t": "Tratá-la como espécie nova de pessoa jurídica."}, {"id": "2-9", "q": "Como ficam os conselhos profissionais e a OAB?", "a": "Conselhos (CRM, CREA): autarquias corporativas de direito público; prestam contas ao TCU, licitam e fazem concurso, mas não se submetem ao regime de precatórios e contratam pela CLT. OAB: segundo o STF, é de direito privado, não é autarquia e não integra a Administração (não presta contas, não licita, não faz concurso).", "t": "Tratar a OAB como autarquia."}, {"id": "2-10", "q": "O que têm em comum empresas públicas e sociedades de economia mista?", "a": "Personalidade de direito privado, criação autorizada por lei (nascem com o registro), regime híbrido; podem explorar atividade típica de Estado ou atividade econômica (neste caso, regime próprio das empresas privadas); extinção por autorização legislativa (pode ser lei genérica); sujeitas ao Tribunal de Contas.", "t": "Exigir lei específica para a extinção."}, {"id": "2-11", "q": "Como são o patrimônio e a falência das estatais?", "a": "Bens de natureza privada, sem impenhorabilidade nem imprescritibilidade, salvo os de estatais prestadoras de serviço público (bens diretamente vinculados à prestação são impenhoráveis). Nenhuma estatal se sujeita à falência; se não conseguir pagar, o ente instituidor responde de forma subsidiária.", "t": "Dizer que EP e SEM podem falir por serem de direito privado."}, {"id": "2-12", "q": "Estatais têm benefícios fiscais e imunidade recíproca?", "a": "Exploradoras de atividade econômica não podem ter privilégios fiscais não extensivos ao setor privado, salvo em monopólio. Pela letra da CF, a imunidade não alcança EP e SEM, mas o STF a estendeu às que prestam serviços públicos obrigatórios e exclusivos do Estado, sem distribuir lucros e sem ações negociadas em bolsa (ex.: Correios, Infraero).", "t": "Estender a imunidade a toda estatal."}, {"id": "2-13", "q": "Como é o regime de pessoal das estatais?", "a": "CLT (emprego público), concurso obrigatório, sem estabilidade (art. 41). A demissão de concursados deve ser motivada com fundamento razoável, sem exigir processo administrativo ou contraditório. Teto só para estatais dependentes. RGPS; litígios na Justiça do Trabalho; agentes públicos para improbidade.", "t": "Exigir PAD para demitir empregado público."}, {"id": "2-14", "q": "Como a atividade da estatal define o regime e a responsabilidade civil?", "a": "Atividade econômica: regime predominantemente privado e responsabilidade subjetiva (dolo ou culpa). Serviço público: regras predominantemente de direito público e responsabilidade objetiva.", "t": "Aplicar responsabilidade objetiva a toda estatal."}, {"id": "2-15", "q": "Quais as três diferenças fundamentais entre EP e SEM?", "a": "Capital: EP 100% público; SEM misto, com maioria votante estatal. Forma: EP qualquer forma admitida em direito; SEM obrigatoriamente S.A. Foro (entidades federais): EP na Justiça Federal; SEM na Justiça Estadual (Súmulas 508 do STF e 42 do STJ).", "t": "Trocar as três diferenças entre si."}, {"id": "2-16", "q": "Julgue: as causas do Banco do Brasil (SEM federal) são julgadas pela Justiça Federal.", "a": "ERRADO. SEM federal tem causas na Justiça Estadual. A EP federal (ex.: Caixa) é julgada pela Justiça Federal.", "t": "Inverter o foro de EP e SEM."}, {"id": "2-18", "q": "Diferencie fundações privadas e fundações públicas quanto ao instituidor.", "a": "Privadas: nascem da iniciativa de particulares, que destinam parte do patrimônio a fins sociais. Públicas: instituídas pelo Estado, com dotação patrimonial e recursos orçamentários, para atividades de interesse social (assistência, saúde, educação, pesquisa, cultura).", "t": "Chamar de pública a fundação instituída por particular."}, {"id": "2-19", "q": "Quais as naturezas das fundações públicas e como nascem?", "a": "Direito público (fundações autárquicas): equiparadas a autarquias; criadas por lei específica, com personalidade desde a vigência da lei; extinção por lei específica. Direito privado: regime híbrido; criação autorizada por lei específica, com personalidade só com o registro do ato constitutivo no Cartório de Registro Civil de Pessoas Jurídicas; extinção autorizada por lei.", "t": "Dizer que toda fundação pública é de direito público."}, {"id": "2-20", "q": "Qual o papel da lei complementar quanto às fundações públicas?", "a": "A CF exige lei complementar para definir as áreas de atuação de todas as fundações públicas. Ela não as cria nem as autoriza individualmente: isso cabe à lei específica.", "t": "Atribuir à lei complementar a criação das fundações."}, {"id": "2-22", "q": "É possível constituir fundação pública para explorar atividade econômica? E qual o foro federal?", "a": "Não. Fundação pública é só para atividades sociais; atividade econômica é de EP e SEM. Foro federal: fundações de direito público na Justiça Federal; as de direito privado também, segundo a jurisprudência do STJ (equiparadas a EP), embora a doutrina divirja.", "t": "Permitir fundação pública exploradora de atividade econômica."}, {"id": "2-23", "q": "Comparativo: como é a extinção das entidades da Administração Indireta?", "a": "Autarquia: lei específica (paralelismo). EP e SEM: autorização legislativa (pode ser lei genérica de desestatização). Fundação de direito público: lei. Fundação de direito privado: autorização em lei.", "t": "Exigir lei específica para extinguir EP e SEM."}, {"id": "2-24", "q": "Comparativo: quais são o regime e a responsabilidade civil de cada entidade?", "a": "Autarquia: direito público; responsabilidade objetiva. EP e SEM: direito privado (híbrido); objetiva se serviço público e subjetiva se atividade econômica. Fundação pública: público (autárquico) ou privado; objetiva como regra para prestadoras de serviço público.", "t": "Aplicar a mesma responsabilidade a todas."}], "3": [{"id": "3-1", "q": "O que significa dizer que poder administrativo é poder-dever?", "a": "Para o agente público, o poder é um dever de agir: não é faculdade de atuar ou não, e sim instrumento para atender ao interesse público.", "t": "Tratar o poder como mera faculdade do agente."}, {"id": "3-2", "q": "Diferencie poder vinculado e discricionário, e oportunidade e conveniência.", "a": "Vinculado: a lei não deixa margem; o agente é obrigado a agir. Discricionário: o agente avalia o mérito (conveniência e oportunidade) nos limites da lei, da razoabilidade e da proporcionalidade. Oportunidade: o momento da edição do ato. Conveniência: as circunstâncias e condições de edição.", "t": "Trocar oportunidade (momento) por conveniência (circunstâncias)."}, {"id": "3-3", "q": "O que abrange o poder hierárquico?", "a": "Ordenar, fiscalizar, delegar e avocar (excepcional e temporário); editar atos normativos internos; rever atos de subordinados (anular ou revogar). Não há hierarquia entre Direta e Indireta (há vinculação e tutela) nem entre Poderes.", "t": "Falar em hierarquia entre Poderes ou entre Direta e Indireta."}, {"id": "3-4", "q": "O que não se pode delegar (CENORA) e qual a diferença entre delegação e avocação?", "a": "CENORA: Competência exclusiva, atos Normativos e Recursos administrativos. Delegação: transfere a execução (titularidade fica com o delegante), com ou sem hierarquia, revogável a qualquer tempo. Avocação: chamar para si função de subordinado; só com hierarquia, discricionária, excepcional, temporária e por motivos relevantes justificados.", "t": "Admitir avocação sem hierarquia."}, {"id": "3-5", "q": "O que é o poder disciplinar e como se estrutura?", "a": "Punir infrações de servidores e de particulares com vínculo específico (ex.: contratados). Exige motivação obrigatória, contraditório e ampla defesa. É parte vinculado e parte discricionário (tipificação da falta vinculada; escolha e gradação da penalidade com margem). Servidores sujeitam-se ao poder disciplinar e ao hierárquico; particulares com vínculo especial, só ao disciplinar.", "t": "Dizer que o poder disciplinar é totalmente discricionário."}, {"id": "3-6", "q": "Compare poder disciplinar e poder de polícia.", "a": "Vínculo: disciplinar específico (funcional ou contratual); polícia geral (todos os cidadãos). Âmbito: disciplinar interno; polícia externo, em prol da coletividade. Objeto: infrações funcionais × direitos, bens e atividades. Fundamento: hierarquia (para servidores) × supremacia do interesse público.", "t": "Classificar multa de trânsito como poder disciplinar."}, {"id": "3-7", "q": "Qual a função do poder regulamentar e quem o exerce?", "a": "Editar atos que complementam as leis para permitir sua aplicação (decretos para fiel execução), conferido ao chefe do Executivo de todas as esferas. Não inova o ordenamento. A expedição de decretos e regulamentos pelo Presidente é indelegável.", "t": "Dizer que o decreto regulamentar inova a ordem jurídica."}, {"id": "3-8", "q": "Quais são as exceções em que o ato do Executivo pode inovar?", "a": "Decreto autônomo (privativo do PR): (a) organização e funcionamento da administração federal, sem custos e sem criar nem extinguir órgãos; (b) extinção de cargos, apenas quando vagos. Regulamentos autorizados: suprem lacunas deixadas propositalmente pelo legislador.", "t": "Admitir decreto autônomo para criar órgãos ou aumentar despesa."}, {"id": "3-9", "q": "O que é o poder normativo em sentido amplo?", "a": "Toda a capacidade normativa da Administração, que envolve várias autoridades (não só chefes do Executivo): instruções normativas de ministros, resoluções de órgãos colegiados, portarias. Ex.: resoluções e normas técnicas das agências reguladoras.", "t": "Restringi-lo ao chefe do Executivo."}, {"id": "3-10", "q": "Quem controla os atos normativos que extrapolam o poder regulamentar?", "a": "O Congresso pode sustar atos normativos do Executivo que ultrapassem o poder regulamentar, e eles se sujeitam ao controle de legalidade do Judiciário.", "t": "Dizer que ficam imunes ao controle."}, {"id": "3-11", "q": "O que é poder de polícia e como se divide?", "a": "Faculdade de condicionar e restringir direitos, bens e atividades individuais em prol do interesse público. Polícia administrativa: atua sobre bens e atividades, predominantemente preventiva. Polícia judiciária: atua sobre pessoas envolvidas em crimes, predominantemente repressiva.", "t": "Trocar o caráter preventivo e repressivo das duas."}, {"id": "3-12", "q": "Quais os atributos do poder de polícia (DAC)?", "a": "Discricionariedade (margem de escolha na fiscalização e sanção, exceto em licenças, que são vinculadas); Autoexecutoriedade (executa sem ordem judicial, com urgência ou previsão legal; não está em todas as medidas); Coercibilidade (imposição coativa).", "t": "Dizer que a autoexecutoriedade está em todas as medidas."}, {"id": "3-13", "q": "Quais são as fases do ciclo de polícia?", "a": "(1) Ordem ou legislação (normas que condicionam ou restringem direitos); (2) consentimento (anuência prévia: licenças e autorizações); (3) fiscalização; (4) sanção. Atos preventivos: licenças (vinculadas) e autorizações (discricionárias). Atos repressivos: multas.", "t": "Misturar a ordem de legislação e sanção."}, {"id": "3-14", "q": "O que diferencia o poder de polícia originário do delegado?", "a": "Originário: exercido pelas entidades políticas, pela Administração direta. Delegado/outorgado: exercido pela Administração indireta.", "t": "Entender delegação como transferência a particulares."}, {"id": "3-15", "q": "O STF admite delegar o poder de polícia? Em que condições?", "a": "É constitucional delegar consentimento, fiscalização e sanção a estatais de direito privado (EP e SEM) que prestem serviço público exclusivo, não concorrencial, de capital majoritariamente público, por meio de lei. A fase de ordem (legislativa) é indelegável. A autarquias e fundações autárquicas, é possível delegar todas as fases, exceto a edição de normas primárias. Proibida a entidades de direito privado exploradoras de atividade econômica.", "t": "Admitir delegação do poder de polícia a particulares."}, {"id": "3-16", "q": "Julgue: o poder de polícia pode ser delegado a particulares.", "a": "ERRADO. Somente atividades materiais de apoio podem ser terceirizadas.", "t": "Confundir apoio material com o exercício do poder de polícia."}, {"id": "3-17", "q": "As multas de polícia são autoexecutórias?", "a": "A aplicação da multa é autoexecutória; a cobrança forçada exige o Judiciário. Exigibilidade: meios indiretos de coação (administrado executa a medida). Executoriedade (autoexecutoriedade): meios diretos, com uso de força (a Administração executa).", "t": "Dizer que o Estado pode “tomar” o valor da multa sem ação judicial."}, {"id": "3-18", "q": "Qual a diferença entre excesso de poder e desvio de finalidade?", "a": "Excesso de poder: vício de competência (o agente atua fora de sua competência legal). Desvio de finalidade: vício de finalidade (o agente tem competência, mas busca fim diverso do interesse público ou do previsto em lei; ex.: remoção-castigo). Ambos formam o abuso de poder.", "t": "Trocar os dois conceitos."}, {"id": "3-19", "q": "Cabe recurso hierárquico impróprio das decisões de agências reguladoras para o Ministério?", "a": "Apenas se a agência fugir de sua finalidade legal, pois não há subordinação, só tutela.", "t": "Admitir revisão ministerial como regra."}], "6": [{"id": "6-1", "q": "Qual a teoria que explica a atuação do agente em nome do Estado e qual o conceito legal de agente público?", "a": "Teoria do órgão: a atuação do agente é imputada diretamente ao Estado. Conceito (Lei 8.429/92): quem exerce, ainda que transitoriamente ou sem remuneração, por eleição, nomeação, designação, contratação ou qualquer forma de investidura, mandato, cargo, emprego ou função nas entidades estatais. Vai do Presidente ao mesário, ao estagiário e ao motorista de concessionária.", "t": "Restringir agente público a quem tem remuneração."}, {"id": "6-2", "q": "Qual a classificação de Hely Lopes Meirelles dos agentes públicos?", "a": "Agentes políticos; agentes administrativos (servidores públicos, empregados públicos e temporários); agentes honoríficos; agentes delegados; agentes credenciados.", "t": "Esquecer os agentes credenciados."}, {"id": "6-3", "q": "Quem são os agentes políticos?", "a": "Altos escalões do governo, com plena liberdade funcional e subsídio: Chefes do Executivo, auxiliares imediatos (ministros e secretários), parlamentares e magistrados. O STF tende a considerar membros de Tribunais de Contas ocupantes de cargos administrativos para fins de nepotismo.", "t": "Incluir servidores comuns."}, {"id": "6-4", "q": "Quem são os agentes administrativos e de que tipos?", "a": "O maior grupo: atividade profissional e hierarquizada. Servidores públicos (titulares de cargo, regime estatutário); empregados públicos (CLT, comuns em EP e SEM); temporários (art. 37, IX; exercem função, não ocupam cargo nem emprego; regime especial).", "t": "Dizer que temporários ocupam cargo."}, {"id": "6-5", "q": "Diferencie agentes honoríficos, delegados e credenciados.", "a": "Honoríficos: cidadãos convocados para serviços relevantes (mesários, jurados), vínculo transitório, geralmente sem remuneração. Delegados: particulares que executam serviço em nome próprio, por sua conta e risco (concessionários, permissionários, leiloeiros, notários); responsabilidade objetiva. Credenciados: representam a Administração em ato específico mediante remuneração.", "t": "Dizer que os delegados são representantes da Administração."}, {"id": "6-6", "q": "Diferencie agentes de fato necessários e putativos.", "a": "Necessários: atuam em emergência ou calamidade (cidadão que assume como autoridade numa enchente). Putativos: atuam sob presunção de legitimidade, com vício na investidura (nomeado sem concurso). Atos são válidos perante terceiros de boa-fé (teoria da aparência) e o agente tem direito à remuneração, para evitar enriquecimento ilícito.", "t": "Inverter necessários e putativos."}, {"id": "6-7", "q": "Quais os requisitos da teoria da aparência e como ela difere de excesso de poder e desvio de finalidade?", "a": "Aparência objetiva de legitimidade, boa-fé do terceiro (sem conluio) e atuação compatível com o esperado da função. Excesso e desvio são vícios de agentes regularmente investidos; na aparência, o agente não tem investidura regular e o foco é a plausibilidade objetiva do ato. Sem ela, afasta-se a proteção a terceiros.", "t": "Aplicar a teoria ao usurpador."}, {"id": "6-8", "q": "Diferencie cargo, emprego e função pública.", "a": "Cargo: unidade de competência criada por lei, com vencimento pago pelos cofres públicos (efetivo ou comissionado); regime estatutário. Emprego: vínculo celetista; comum em estatais e agora permitido também na Administração Direta. Função: conjunto de atribuições; as autônomas (confiança, temporários) não têm cargo vinculado.", "t": "Dizer que emprego público é vedado na Administração Direta."}, {"id": "6-9", "q": "O que mudou com o fim da obrigatoriedade do Regime Jurídico Único?", "a": "A EC 19/1998 extinguiu a obrigatoriedade do RJU, mas a mudança ficou suspensa por liminar do STF (ADI 2.135). Em 2024, o STF julgou o mérito e a considerou constitucional: União, Estados e Municípios podem instituir regime estatutário ou celetista na Direta e autárquica, conforme a lei de cada carreira. Espera-se o estatutário nas carreiras típicas de Estado.", "t": "Dizer que o RJU continua obrigatório."}, {"id": "6-10", "q": "Como é o regime estatutário?", "a": "Vínculo legal e unilateral; a Administração altera regras por lei, sem direito adquirido à imutabilidade (exceto se já preenchidos os requisitos do direito); pluralidade normativa (cada ente tem seu regime); litígios na Justiça Comum (Federal ou Estadual); estabilidade (exceto cargo comissionado).", "t": "Atribuir litígios estatutários à Justiça do Trabalho."}, {"id": "6-11", "q": "Como é o regime celetista no serviço público?", "a": "Vínculo contratual e bilateral; alterações exigem anuência mútua e mudanças na CLT só valem para contratos futuros; litígios na Justiça do Trabalho (exceto fase pré-contratual do concurso, que é da Justiça Comum); sem estabilidade; demissão em EP e SEM motivada, sem PAD; exige concurso e veda acumulação.", "t": "Mandar a fase de concurso de celetistas à Justiça do Trabalho."}, {"id": "6-12", "q": "Quais os requisitos de ingresso e o que o edital pode fazer?", "a": "Condições e limitações devem estar previstas em lei antes e só então constar do edital. Exigências de idade, sexo ou altura só valem se a natureza do cargo justificar, razoáveis e com amparo legal. Editais não podem restringir tatuagens, salvo conteúdo que viole valores constitucionais.", "t": "Criar restrição só no edital."}, {"id": "6-13", "q": "Quando se comprovam os requisitos do cargo?", "a": "Regra: na posse (Súmula 266 do STJ). Exceções, na inscrição: idade máxima e a atividade jurídica de 3 anos (Magistratura e MP) ou 2 anos (DPU, AGU etc.), seguindo a regra mais favorável ao candidato.", "t": "Exigir a comprovação na inscrição como regra."}, {"id": "6-14", "q": "Quem pode ser estrangeiro ou exige brasileiro nato?", "a": "Estrangeiros: acesso na forma da lei (eficácia limitada); universidades podem admitir professores e cientistas estrangeiros. Privativos de natos: Presidente, Vice, Presidentes da Câmara e do Senado, Ministros do STF (todos), carreira diplomática, oficiais das Forças Armadas e Ministro da Defesa (apenas este entre os ministros de Estado).", "t": "Exigir brasileiro nato de todos os ministros de Estado."}, {"id": "6-15", "q": "Como deve ser composto o concurso e qual o papel da prova de títulos?", "a": "Obrigatoriamente de provas ou de provas e títulos; não se admite seleção só por títulos ou análise curricular. A prova de títulos é exclusivamente classificatória; seu uso eliminatório é inconstitucional. Curso de formação pode ser segunda etapa, eliminatória e classificatória.", "t": "Admitir eliminação por nota mínima na prova de títulos."}, {"id": "6-16", "q": "Quais as condições do exame psicotécnico (SV 44)?", "a": "Exige, cumulativamente: previsão em lei e no edital, compatibilidade com o cargo, critérios objetivos (rigor científico) e possibilidade de recurso.", "t": "Dizer que basta a previsão no edital."}, {"id": "6-17", "q": "O que é inconstitucional em provimento de cargos?", "a": "Servidor se investir em cargo diferente do aprovado (sobe de nível médio para superior por prova interna); converter cargo temporário em permanente; passar de CLT para estatutário mediante extinção de estatal.", "t": "Admitir ascensão e transferência."}, {"id": "6-18", "q": "Qual o prazo de validade do concurso e a regra de prorrogação?", "a": "Até 2 anos, contados da homologação (pode ser menor). Prorrogável uma única vez, obrigatoriamente por igual período ao fixado inicialmente, por ato discricionário. A Administração escolhe o momento da nomeação dentro da validade.", "t": "Admitir várias prorrogações ou prazo obrigatório de 2 anos."}, {"id": "6-19", "q": "A nomeação sem concurso pode ser anulada após 5 anos?", "a": "Sim, a qualquer tempo: é inconstitucionalidade flagrante e não se sujeita ao prazo decadencial de 5 anos.", "t": "Aplicar decadência quinquenal."}, {"id": "6-21", "q": "Quais as hipóteses de direito subjetivo à nomeação?", "a": "(1) Aprovação dentro do número de vagas do edital; (2) preterição na ordem de classificação (Súmula 15 do STF); (3) surgimento de novas vagas + preterição arbitrária (ex.: temporário ilegal em vaga com aprovado em cadastro de reserva); (4) candidato que passa a figurar nas vagas após desistência de classificados superiores.", "t": "Dizer que o aprovado dentro das vagas tem só expectativa."}, {"id": "6-22", "q": "Qual a tese do Tema 784 (RE 837.311) para o cadastro de reserva?", "a": "Aprovados fora das vagas têm, em regra, mera expectativa. Novas vagas ou novo concurso durante a validade não geram direito automaticamente. Exceção: preterição arbitrária e imotivada, provada por caminhos independentes: (1) temporários ou terceirizados nas mesmas atribuições (salvo urgência) ou (2) novo concurso com nomeações efetivas durante a validade do anterior.", "t": "Reconhecer direito do cadastro de reserva pela mera abertura de edital."}, {"id": "6-23", "q": "O que não configura preterição e quem prova?", "a": "Mera abertura de edital sem nomeações, alegação genérica de necessidade do serviço, justificativa orçamentária fundamentada, concurso para cargo, nível ou lotação diferente, provimento por remoção ou redistribuição regular. O ônus é do candidato; o direito só existe se o fato ocorrer dentro da validade do concurso.", "t": "Reconhecer preterição após a validade."}, {"id": "6-24", "q": "O limite prudencial da LRF afasta o direito à nomeação?", "a": "Não, por si só (limite prudencial de 95% do limite de despesa de pessoal). A Administração deve fazer estudo orçamentário antes do edital. O Estado só recusa a nomeação com justificativa superveniente, imprevisível, grave e necessária, como última opção.", "t": "Aceitar o limite da LRF como justificativa suficiente."}, {"id": "6-25", "q": "O candidato nomeado tardiamente por decisão judicial tem direito a indenização (Tema 671)?", "a": "Não, em regra: não há indenização pelo período em que não exerceu o cargo, salvo arbitrariedade flagrante e objetivamente comprovada. Só posse e exercício geram os benefícios do cargo, e não há efeitos previdenciários retroativos sem contribuição.", "t": "Conceder indenização pelo atraso como regra."}, {"id": "6-26", "q": "Como funcionam as cotas de PcD?", "a": "A lei deve reservar percentual: mínimo de 5% e máximo de 20%, qualquer ente (que pode ter lei própria); arredonda-se desde que não ultrapasse o máximo. Visão monocular dá direito (Súmula 377 do STJ). É possível eliminar se a deficiência for incompatível com o cargo, caso a caso.", "t": "Fixar percentual fora de 5% a 20%."}, {"id": "6-28", "q": "O que o Judiciário pode controlar em concursos?", "a": "Não substitui a banca, mas faz juízo de compatibilidade do conteúdo das questões com o edital e controla ilegalidade e inconstitucionalidade: descumprimento do edital, cobrança de conteúdo não previsto e desrespeito a precedentes obrigatórios. Condenado criminalmente com trânsito em julgado pode tomar posse se compatível com a pena (STJ), com exercício conforme o regime da pena.", "t": "Dizer que o Judiciário reavalia notas."}, {"id": "6-29", "q": "Quais as exceções à exigência de concurso?", "a": "Cargos em comissão (direção, chefia e assessoramento); contratações temporárias (art. 37, IX); agentes comunitários de saúde e de combate a endemias (processo seletivo público); entidades fora da Administração (Sistema S, Organizações Sociais, OAB).", "t": "Confundir processo seletivo simplificado com processo seletivo público."}, {"id": "6-30", "q": "Diferencie cargo em comissão e função de confiança.", "a": "Ambos só para direção, chefia e assessoramento. Função de confiança: exclusiva de servidor efetivo; designação e dispensa. Cargo em comissão: livre nomeação e exoneração (ad nutum), sem processo administrativo, contraditório ou motivação; servidor estatutário sem estabilidade, no RGPS; pode ser de particular, com percentual mínimo para servidores de carreira.", "t": "Dizer que o ocupante de cargo em comissão tem estabilidade."}, {"id": "6-31", "q": "Qual a diferença entre exoneração, demissão e destituição e como fica a gestante?", "a": "Exoneração: sem caráter sancionatório (a pedido, inabilitação em estágio probatório, não entrar em exercício no prazo). Demissão: sanção. Destituição: equivale à demi
